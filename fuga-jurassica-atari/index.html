    this.spikes = d.spikes.map(s => ({ x: s[0], y: GROUND_Y - 16, w: s[1], h: 16 }));
    this.vents = d.vents.map(v => ({ x: v[0], w: 36, period: v[1], phase: v[2] }));
    this.items = d.items.map(it => mkItem(it, 0)).concat(d.arena.items.map(it => mkItem(it, d.ax)));
    const R = seeded(1234 + i * 777);
    this.far = []; for (let x = -200; x < 2400; x += 50 + R() * 70) this.far.push([x, 150 + R() * 130]);
    this.trees = []; for (let x = -100; x < 3400; x += 80 + R() * 120) this.trees.push([x, 0.7 + R() * 0.6, R()]);
    this.ferns = [];
    for (const g of this.ground) for (let x = g.x + 20; x < g.x + Math.min(g.w, 1000) - 20; x += 40 + R() * 90) this.ferns.push([x, R()]);
    this.specks = []; for (let k = 0; k < 360; k++) this.specks.push([R() * this.endX, GROUND_Y + 16 + R() * 70, 1 + R() * 3]);
  }
  onGroundAt(x) { for (const g of this.ground) if (x >= g.x && x <= g.x + g.w) return true; return false; }
  ventState(v, t) {
    const tt = (t + v.phase) % v.period;
    return tt > v.period - 0.9 ? 2 : tt > v.period - 1.7 ? 1 : 0;
  }

  // ---------- Fundo: faixas de céu, sol, morros e árvores em silhueta (paralaxe) ----------
  drawBg(camX, t, flash, fury) {
    const th = this.th, MIDY = Math.round((GROUND_Y - 34) / SY);
    const sky = fury ? (tog(t, 2) ? ['K', 'M', 'M', 'R'] : ['M', 'R', 'R', 'M']) : th.sky;
    const bh = Math.ceil(MIDY / sky.length);
    sky.forEach((col, i) => fr(0, i * bh, BW, bh, flash || col));
    if (th.sun && !flash) {
      const sx = Math.round(BW * 0.78 - camX * 0.02 / SX);
      pell(sx, 31, 6, 12, th.sun);
      fr(sx - 7, 36, 15, 1, sky[0]); fr(sx - 7, 39, 15, 2, sky[1]);
    }
    if (th.volcano) {
      const vx = Math.round((620 - camX * 0.05) / SX), top = 50;
      for (let y = top; y < MIDY; y += 2) fr(vx - Math.round((70 + (y - top) / (GY - top) * 260) / SX), y, Math.round((70 + (y - top) / (GY - top) * 260) / SX) * 2, 2, 'K');
      fr(vx - 11, top - 1, 23, 2, tog(t, 3) ? 'O' : 'R');
      for (let k = 0; k < 24; k++) fr(vx - 3 - (k >> 1), top + 1 + k * 2, 2, 2, (k + Math.floor(t * 6)) % 4 ? 'R' : 'O');
      for (let i = 0; i < 4; i++) {
        const k = (t * 0.15 + i / 4) % 1;
        pell(vx + Math.round(Math.sin(i * 2) * 5 * k), Math.round(46 - k * 45), Math.round(2 + 5 * k), Math.round(4 + 9 * k), 'D');
      }
    }
    // Morros/mesas distantes em degraus
    const far = this.far, q = th.tree === 'mesa' ? 6 : 2;
    let j = 0;
    for (let col = 0; col < BW; col += 2) {
      const wx = col * SX + camX * 0.15;
      while (j < far.length - 2 && far[j + 1][0] < wx) j++;
      const a = far[j], b = far[j + 1], k = clamp((wx - a[0]) / (b[0] - a[0]), 0, 1);
      const y = th.tree === 'mesa' ? (k < 0.5 ? a[1] : b[1]) : lerp(a[1], b[1], k);
      const row = Math.round(y / SY / q) * q;
      fr(col, row, 2, MIDY - row, th.far);
    }
    const base = Math.round((GROUND_Y - 30) / SY);
    for (const [x, s, r] of this.trees) {
      const sx = Math.round((x - camX * 0.4) / SX);
      if (sx < -30 || sx > BW + 30) continue;
      this.drawTree(sx, base, s, r, t, th.tree, th.mid);
    }
    fr(0, MIDY, BW, BH - MIDY, th.mid);
  }
  drawTree(x, b, s, r, t, type, col) {
    if (type === 'palm') {
      const h = Math.round(50 * s), lean = Math.round(22 * s / SX), tx = x + lean, ty = b - h, w = Math.round(10 * s);
      const sw = tog(t * 0.7 + r * 6, 1);
      for (let i = 0; i < h; i++) fr(x + Math.round(lean * i / h), b - i, i < h / 2 ? 2 : 1, 1, col);
      fr(tx - w + 2, ty - 1, 2 * w - 3, 1, col); fr(tx - w, ty, 2 * w + 1, 1, col);
      fr(tx - w - 1, ty + 1, 3, 1, col); fr(tx + w - 1, ty + 1, 3, 1, col);
      fr(tx - w - 2 + sw, ty + 2, 2, 3, col); fr(tx + w + 1 - sw, ty + 2, 2, 3, col);
      fr(tx - 3, ty + 1, 2, 3, col); fr(tx + 2, ty + 1, 2, 3, col);
    } else if (type === 'cypress') {
      const h = Math.round(40 * s);
      fr(x - 1, b - h, 2, h, col);
      for (let i = 0; i < 4; i++) pell(x + (i % 2 ? 3 : -3), b - Math.round((37 + 8 * i) * s), Math.round(5 * s), Math.round(10 * s), col);
      for (let i = 0; i < 5; i++) fr(x - Math.round(5 * s) + i * Math.round(2.3 * s), b - Math.round(33 * s), 1, Math.round((10 + r * 10) * s), col);
    } else if (type === 'conifer') {
      const tr = Math.round(13 * s);
      fr(x - 1, b - tr, 2, tr, col);
      for (let i = 0; i < 4; i++) {
        const yb = b - Math.round((10 + 15 * i) * s), hh = Math.round(27 * s), hw = (10 - 2 * i) * s;
        for (let k = 0; k < hh; k++) { const w = Math.round(hw * (k + 1) / hh); fr(x - w, yb - hh + k, 2 * w + 1, 1, col); }
      }
    } else if (type === 'mesa') {
      const w = (40 + r * 50) * s / SX, h = Math.round((60 + r * 120) * s / SY);
      for (let k = 0; k < h; k += 2) { const ww = Math.round(lerp(w * 0.8, w, k / h)); fr(x - ww, b - h + k, ww * 2, 2, col); }
    } else {
      const h = Math.round(43 * s);
      for (let i = 0; i < h; i++) fr(x + Math.round(i / h), b - i, 1, 1, col);
      for (let i = 0; i < 4; i++) {
        const y = b - Math.round((20 + i * 6) * s), d = i % 2 ? 1 : -1, len = Math.round((5 - i * 0.6) * s);
        for (let k = 0; k <= len; k++) fr(x + d * k, y - k, 1, 1, col);
      }
    }
  }

  // ---------- Terreno (coordenadas do mundo convertidas para pixels) ----------
  drawTerrain(t, treeShake) {
    const th = this.th, g0 = GY + OY;
    if (th.pit === 'lava') {
      const y0 = byW(H - 44);
      fr(0, y0, BW, BH, 'R'); fr(0, y0, BW, 2, 'O');
      for (let x = 0; x < BW; x++) if (((x - OX + Math.floor(t * 6)) & 7) < 2) fr(x, y0 - 1, 1, 1, 'Y');
    } else if (th.pit === 'water') {
      const y0 = byW(H - 50);
      fr(0, y0, BW, BH, 'B');
      for (let x = 0; x < BW; x++) if (((x - OX + Math.floor(t * 3)) & 7) < 2) fr(x, y0, 1, 1, 'C');
    } else fr(0, byW(GROUND_Y + 20), BW, BH, 'K');
    // Árvores grandes da arena (sacodem com o braquiossauro)
    for (const ax of [this.AX + 70, this.AX + 890]) {
      const x = bxW(ax);
      if (x < -30 || x > BW + 30) continue;
      const sh = treeShake > 0 ? (tog(t, 15) ? 1 : -1) : 0;
      fr(x - 2, byW(GROUND_Y - 260), 5, Math.round(260 / SY) + 1, 'n');
      for (let i = 0; i < 5; i++) pell(x + sh + Math.round(Math.cos(i * 1.3) * 10), byW(GROUND_Y - 280 + Math.sin(i * 1.9) * 26), 9, 17, th.fern);
    }
    for (const g of this.ground) {
      const a = bxW(g.x), b = bxW(g.x + g.w);
      if (b < 0 || a > BW) continue;
      const gy = byW(g.y);
      fr(a, gy, b - a, BH - gy, th.dirt);
      fr(a, gy + 11, b - a, BH, th.dirt2);
      fr(a, gy - 1, b - a, 3, th.grass);
      fr(a, gy + 2, 1, BH, th.dirt2); fr(b - 1, gy + 2, 1, BH, th.dirt2);
      for (let x = Math.max(a, 0); x < Math.min(b, BW); x++) if (((x - OX) & 3) === 0) fr(x, gy - 2, 1, 1, th.grass);
    }
    for (const [sx, sy, sz] of this.specks) {
      const x = bxW(sx);
      if (x >= 0 && x < BW && this.onGroundAt(sx)) fr(x, byW(sy), sz > 2.5 ? 2 : 1, 1, th.dirt2);
    }
    for (const [fx, r] of this.ferns) {
      const x = bxW(fx);
      if (x < -4 || x > BW + 4) continue;
      blit(tog(t * 0.8 + r * 3, 1) ? BM.fern1 : BM.fern2, x, g0 - 2, 1, () => th.fern);
    }
    const hi = th.rock === 'L' ? 'W' : 'L';
    for (const b of this.blocks) {
      const x = bxW(b.x), y = byW(b.y), w = bxW(b.x + b.w) - x, h = byW(b.y + b.h) - y + 1;
      if (x > BW || x + w < 0) continue;
      fr(x, y, w, h, th.rock); fr(x + 1, y, w - 2, 1, hi);
      fr(x + Math.round(w * 0.35), y + 3, 1, Math.round(h * 0.4), 'K'); fr(x + Math.round(w * 0.35) + 1, y + 3 + Math.round(h * 0.4), 1, Math.round(h * 0.4), 'K');
    }
    for (const p of this.oneways) {
      const x = bxW(p.x), y = byW(p.y), w = bxW(p.x + p.w) - x;
      if (x > BW || x + w < 0) continue;
      fr(x + 2, y + 4, 1, 4, 'K'); fr(x + w - 3, y + 4, 1, 4, 'K');
      fr(x, y, w, 4, th.plank); fr(x, y, w, 1, 'S');
      for (let k = x + 4; k < x + w - 1; k += 4) fr(k, y + 1, 1, 3, 'n');
    }
    for (const s of this.spikes) {
      const x0 = bxW(s.x), x1 = bxW(s.x + s.w), top = byW(s.y);
      if (x0 > BW || x1 < 0) continue;
      for (let x = x0; x < x1 - 1; x += 2) {
        fr(x, top + 1, 1, g0 - top - 1, 'L'); fr(x + 1, top + 3, 1, g0 - top - 3, 'D'); fr(x, top, 1, 1, 'R');
      }
    }
    for (const v of this.vents) {
      const x = bxW(v.x), w = bxW(v.x + v.w) - x;
      if (x > BW || x + w < 0) continue;
      const st = this.ventState(v, t), lava = th.pit === 'lava';
      fr(x, g0 - 2, w, 3, 'K'); fr(x + 1, g0 - 1, w - 2, 1, lava ? 'O' : 'L');
      if (st === 1) {
        for (let i = 0; i < 3; i++) { const k = (t * 2 + i / 3) % 1; fr(x + 1 + i * 2, g0 - 3 - Math.round(k * 9), 1, 1, lava ? 'O' : 'W'); }
      } else if (st === 2) {
        const top = byW(GROUND_Y - 170), f = Math.floor(t * 20);
        for (let y = top; y < g0 - 1; y += 2) {
          const o = ((y >> 1) + f) & 1;
          fr(x + o, y, w - 1, 2, lava ? 'O' : 'L'); fr(x + 1 + o, y, Math.max(1, w - 3), 2, lava ? 'Y' : 'W');
        }
      }
    }
  }
}

// =========================================================
//  JOGO: estados, mundo, colisões
// =========================================================
const BEST_KEY = 'fugaJurassica8bit.melhorTempo'; // separado do recorde da versão original

class Game {
  constructor() {
    this.state = 'title'; this.stateT = 0; this.t = 0; this.touch = false;
    this.best = parseFloat(Store.get(BEST_KEY)) || 0; this.newRecord = false;
    this.player = new Player(); this.totalTime = 0;
    this.titleRex = new TRex(0);
    this.btns = [
      { x: W / 2 - 300, y: 285, w: 600, h: 66, label: 'Tentar a fase de novo', key: 'Enter', act: () => this.retryLevel() },
      { x: W / 2 - 300, y: 375, w: 600, h: 66, label: 'Recomeçar do início', key: 'R', act: () => this.startGame() }
    ];
    this.loadLevel(0);
  }
  loadLevel(i) {
    this.levelIndex = i; this.level = new Level(i);
    const L = this.level;
    this.parts = []; this.texts = []; this.bullets = []; this.waves = []; this.debris = []; this.rings = [];
    this.keyItem = null; this.hasKey = false; this.gateOpen = 0; this.gateOpening = false;
    this.fight = false; this.won = false; this.barrier = 0; this.bossIntro = 0; this.treeShake = 0;
    this.levelT = 0; this.cam = { x: 0 }; this.shakeMag = 0; this.sx = 0; this.sy = 0; this.hitStop = 0;
    this.flashT = 0; this.flashCol = 'W'; this.bannerT = 0; this.bannerText = ''; this.bannerSub = ''; this.bannerCol = '#fff'; this.msgT = {};
    this.arena = { x0: L.AX + 22, x1: L.AX + 918 };
    this.dino = makeBoss(L.d.boss, L.AX + 680);
    this.bossShow = this.dino.hp;
    this.player.reset(80, GROUND_Y - 46);
    this._solids = L.solids;
    this.ammoAtStart = this.player.ammo;
  }
  startGame() { this.totalTime = 0; this.player = new Player(); this.loadLevel(0); this.toCard(); }
  toCard() { this.state = 'card'; this.stateT = 0; }
  retryLevel() {
    const p = this.player; p.hp = p.maxHp; p.ammo = Math.max(this.ammoAtStart, 10);
    this.loadLevel(this.levelIndex); this.toCard();
  }
  nextLevel() {
    if (this.levelIndex >= LEVELS.length - 1) { this.win(); return; }
    const p = this.player; p.hp = Math.min(p.maxHp, p.hp + 40); p.ammo = Math.max(p.ammo, 12);
    this.loadLevel(this.levelIndex + 1); this.toCard();
  }
  win() {
    this.state = 'victory'; this.stateT = 0; Sfx.win();
    this.newRecord = !this.best || this.totalTime < this.best;
    if (this.newRecord) { this.best = this.totalTime; Store.set(BEST_KEY, String(this.totalTime)); }
  }
  pause() { if (this.state === 'play') { this.state = 'paused'; this.stateT = 0; Input.clearAll(); } }
  toTitle() { this.state = 'title'; this.stateT = 0; this.player = new Player(); this.loadLevel(0); }
  shake(m) { this.shakeMag = Math.max(this.shakeMag, Math.min(m, 18)); }
  banner(text, col, sub) { this.bannerText = text; this.bannerCol = col; this.bannerSub = sub || ''; this.bannerT = 3.2; }
  // Mensagem com intervalo mínimo, para não poluir a tela
  hint(key, x, y, text, col, size = 13) {
    if ((this.msgT[key] || 0) > this.t) return;
    this.msgT[key] = this.t + 1.4; floatText(x, y, text, col, size);
  }

  update(dt) {
    this.t += dt; this.stateT += dt;
    if (Input.take('mute')) Sfx.muted = !Sfx.muted;
    switch (this.state) {
      case 'title':
        this.cam.x = (this.t * 40) % (this.level.AX - 200);
        if (Input.take('enter')) { Sfx.init(); this.startGame(); }
        break;
      case 'card':
        this.updateFx(dt);
        if (this.stateT > 2.6 || (this.stateT > 0.4 && Input.take('enter'))) { this.state = 'play'; this.stateT = 0; }
        break;
      case 'play':
        if (Input.take('pause')) { this.pause(); break; }
        this.totalTime += dt; this.levelT += dt;
        this.updateWorld(dt);
        break;
      case 'paused':
        if (Input.take('pause') || Input.take('enter')) this.state = 'play';
        else if (Input.take('restart')) this.startGame();
        break;
      case 'clear':
        this.updateFx(dt);
        if (this.stateT > 1.8) this.nextLevel();
        break;
      case 'gameover':
        this.updateFx(dt);
        if (this.stateT > 0.5) {
          if (Input.take('enter')) this.retryLevel();
          else if (Input.take('restart')) this.startGame();
        }
        break;
      case 'victory':
        this.updateFx(dt);
        if (this.stateT > 1 && Input.take('enter')) this.toTitle();
        break;
    }
  }
  tap(x, y) {
    Sfx.init();
    switch (this.state) {
      case 'title': this.startGame(); break;
      case 'card': if (this.stateT > 0.4) { this.state = 'play'; this.stateT = 0; } break;
      case 'paused': this.state = 'play'; break;
      case 'gameover': if (this.stateT > 0.5) for (const b of this.btns) if (pointIn(x, y, b)) { b.act(); return; } break;
      case 'victory': if (this.stateT > 1) this.toTitle(); break;
    }
  }

  updateWorld(dt) {
    if (this.hitStop > 0) { this.hitStop -= dt; return; }
    const L = this.level, p = this.player;
    this.buildSolids();
    p.update(dt);
    if (!this.fight && !this.won && p.x > L.AX + 70 && !p.dead) this.startFight();
    if (this.fight) this.barrier = Math.min(1, this.barrier + dt * 2.5);
    if (this.bossIntro > 0) { this.bossIntro -= dt; if (this.bossIntro <= 0 && !this.dino.dead) this.dino.active = true; }
    this.treeShake = Math.max(0, this.treeShake - dt);
    this.dino.update(dt);
    this.updateBullets(dt);
    this.dinoVsPlayer();
    this.updateHazards();
    this.updateWaves(dt);
    this.updateDebris(dt);
    this.updateItems(dt);
    this.updateKeyGate(dt);
    if (p.y > H + 60 && !p.dead) this.fellInPit();
    if (p.dead && p.deadT > 1.5) { this.state = 'gameover'; this.stateT = 0; }
    this.updateFx(dt);
  }
  startFight() {
    this.fight = true; this.bossIntro = 1.6;
    this.banner(this.dino.name, '#ffd860', this.dino.tip);
    Sfx.roar(this.levelIndex >= 3); this.shake(6);
    this.dino.facePlayer(this.player);
  }
  buildSolids() {
    const L = this.level, s = L.solids.slice();
    if (this.barrier > 0.3) s.push({ x: L.AX - 4, y: -400, w: 24, h: 400 + GROUND_Y });
    if (this.gateOpen < 1) s.push({ x: L.AX + 920, y: -400, w: 40, h: 400 + GROUND_Y });
    this._solids = s;
  }
  solids() { return this._solids; }
  isSafe(p) {
    const L = this.level, l = p.x - 30, r = p.x + p.w + 30;
    if (!L.onGroundAt(l) || !L.onGroundAt(r)) return false;
    for (const s of L.spikes) if (r > s.x - 40 && l < s.x + s.w + 40) return false;
    for (const v of L.vents) if (r > v.x - 40 && l < v.x + v.w + 40) return false;
    return true;
  }
  fellInPit() {
    const p = this.player;
    p.hp -= 20; Sfx.hurt(); this.shake(6); this.flashScreen('R', 0.1);
    if (p.hp <= 0) { p.hp = 0; p.dead = true; p.deadT = 0; p.vy = 0; Sfx.die(); return; }
    p.x = p.safeX; p.y = p.safeY - 10; p.vx = 0; p.vy = 0; p.inv = 1.4; p.stun = 0;
    floatText(p.cx, p.y - 10, 'Caiu! -20', '#ff6a5a', 16);
  }

  // ---------- Armas ----------
  fireBullet(p) {
    const x = p.cx + p.face * 30, y = p.y + 8;
    this.bullets.push({ x, y, px: x, vx: p.face * 780, life: 0.9, dead: false });
    p.muzzle = 0.06; Sfx.shoot();
    for (let i = 0; i < 3; i++) addPart(x + p.face * 6, y, p.face * rand(60, 180), rand(-60, 60), 0.15, '#ffe9a0', 2.5, 0);
  }
  updateBullets(dt) {
    const d = this.dino;
    for (const b of this.bullets) {
      b.px = b.x; b.x += b.vx * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      for (const s of this._solids) if (pointIn(b.x, b.y, s)) { b.dead = true; sparks(b.x, b.y, 4, '#d8d0c0'); break; }
      if (b.dead || d.dead || !this.fight) continue;
      const boxes = d.hurtboxes(), n = Math.max(1, Math.ceil(Math.abs(b.x - b.px) / 6));
      outer: for (let i = 1; i <= n; i++) {
        const xx = b.px + (b.x - b.px) * i / n;
        for (const box of boxes) if (pointIn(xx, b.y, box)) { this.bulletHit(b, box, xx); break outer; }
      }
    }
    this.bullets = this.bullets.filter(b => !b.dead);
  }
  bulletHit(b, box, xx) {
    const d = this.dino; b.dead = true;
    if (box.armor) { sparks(xx, b.y, 8, '#fff2a0'); Sfx.deflect(); this.hint('armor', xx, b.y - 20, 'Blindado!', '#d0e0ff'); return; }
    if (box.absorb) {
      burst(xx, b.y, 5, '#9aa28a', 120, 0.3, 3, 200); Sfx.thud();
      this.hint('absorb', xx, b.y - 20, 'Couro grosso! Mire na cabeça', '#d0e0ff'); return;
    }
    if (!d.takeHit(7 * (box.mult || 1), sign(b.vx), 60, 'bullet')) return;
    Sfx.hit(); sparks(xx, b.y, 6, box.mult > 1 ? '#ffd860' : '#ffffff');
    if (box.mult > 1.4) this.hint('weak', xx, b.y - 34, 'PONTO FRACO!', '#ffd860', 12);
  }
  knifeCheck(p) {
    const d = this.dino;
    if (d.dead || !this.fight || !d.active) return;
    const kb = p.knifeBox(); let best = null, rank = -1;
    for (const box of d.hurtboxes()) {
      if (!overlap(kb, box)) continue;
      const r = box.armor ? 0 : box.absorb ? 1 : 2 + (box.mult || 1);
      if (r > rank) { rank = r; best = box; }
    }
    if (!best) return;
    p.knifeHit = true;
    const hx = p.face > 0 ? Math.max(kb.x, best.x) + 6 : Math.min(kb.x + kb.w, best.x + best.w) - 6;
    const hy = clamp(p.y + 18, best.y, best.y + best.h);
    if (best.armor) {
      d.takeHit(16 * 0.2, p.face, 40, 'knife'); sparks(hx, hy, 10, '#fff2a0'); Sfx.deflect(); this.hitStop = 0.04;
      this.hint('armor', hx, hy - 20, 'Blindado!', '#d0e0ff'); return;
    }
    const mult = best.absorb ? 0.35 : (best.mult || 1);
    d.takeHit(16 * mult, p.face, 220, 'knife');
    this.hitStop = 0.075; this.shake(4); Sfx.hit(); Sfx.thud(); this.flashScreen('W', 0.05);
    burst(hx, hy, 10, '#fff6d0', 260, 0.35, 3, 300); sparks(hx, hy, 6, '#ffd860');
    if (mult > 1.4) this.hint('weak', hx, hy - 34, 'PONTO FRACO!', '#ffd860', 12);
  }
  dinoVsPlayer() {
    const d = this.dino, p = this.player;
    if (d.dead || !d.active || p.dead) return;
    const pb = p.box();
    for (const a of d.attackBoxes()) if (overlap(pb, a)) { p.hurt(a.dmg, sign(p.cx - d.x), a.kb, a.kby); return; }
    for (const c of d.contactBoxes()) {
      if (!overlap(pb, c)) continue;
      if (d.contactDmg > 0) p.hurt(d.contactDmg, sign(p.cx - d.x), 300, 300);
      else { p.x += sign(p.cx - d.x) * 5; if (p.vy > 0 && p.y + p.h < c.y + 20) { p.vy = -380; p.jumping = false; } }
      return;
    }
  }

  // ---------- Perigos ----------
  updateHazards() {
    const L = this.level, p = this.player;
    for (const v of L.vents) {
      if (L.ventState(v, this.levelT) === 2) {
        if (Math.random() < 0.4) addPart(v.x + rand(4, v.w - 4), GROUND_Y - rand(0, 150), rand(-30, 30), rand(-200, -80), 0.5,
          L.th.pit === 'lava' ? '#ffb040' : '#eef4f4', rand(3, 6), 0, 'circ');
        if (!p.dead && overlap(p.box(), { x: v.x, y: GROUND_Y - 170, w: v.w, h: 170 })) p.hurt(12, sign(p.cx - (v.x + v.w / 2)), 200, 820);
      }
    }
    if (p.dead) return;
    for (const s of L.spikes) if (overlap(p.box(), s)) { p.hurt(15, p.vx > 0 ? -1 : 1, 220, 520); break; }
  }
  spawnWave(x, dir, speed, dmg) { this.waves.push({ x, dir, speed, dmg, life: 2.6 }); }
  updateWaves(dt) {
    const p = this.player;
    for (const w of this.waves) {
      w.x += w.dir * w.speed * dt; w.life -= dt;
      if (w.x < this.arena.x0 - 10 || w.x > this.arena.x1 + 10) w.life = 0;
      if (Math.random() < 0.5) dust(w.x, GROUND_Y, 1, '#b8a888', 0.5);
      if (!p.dead && p.onGround && p.y + p.h >= GROUND_Y - 2 && Math.abs(p.cx - w.x) < 22) p.hurt(w.dmg, w.dir, 260, 560);
    }
    this.waves = this.waves.filter(w => w.life > 0);
  }
  spawnDebris(x, delay) {
    let land = GROUND_Y;
    for (const o of this.level.oneways) if (x > o.x && x < o.x + o.w && o.y < land) land = o.y;
    this.debris.push({ x, y: -40, vy: 0, warn: delay, max: delay, land, size: rand(16, 24), rot: rand(0, 6), vr: rand(-6, 6),
      kind: Math.random() < 0.5 ? 'rock' : 'branch', done: false });
  }
  updateDebris(dt) {
    const p = this.player;
    for (const d of this.debris) {
      if (d.warn > 0) { d.warn -= dt; continue; }
      d.vy += 1600 * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      const box = { x: d.x - d.size / 2, y: d.y - d.size / 2, w: d.size, h: d.size };
      const col = d.kind === 'rock' ? '#8a8070' : '#6a4a2a';
      if (!p.dead && overlap(p.box(), box)) { p.hurt(14, sign(p.cx - d.x), 180, 200); d.done = true; burst(d.x, d.y, 8, col, 220, 0.5, 4, 900); }
      else if (d.y + d.size / 2 >= d.land) { d.done = true; burst(d.x, d.land - 4, 8, col, 220, 0.5, 4, 900); dust(d.x, d.land, 4); Sfx.thud(); }
    }
    this.debris = this.debris.filter(d => !d.done);
  }

  // ---------- Itens, chave e portão ----------
  updateItems(dt) {
    const p = this.player;
    for (const it of this.level.items) {
      if (it.taken) {
        if (it.resp > 0) { it.t += dt; if (it.t > it.resp) { it.taken = false; it.t = 0; } }
        continue;
      }
      if (p.dead || !overlap(p.box(), { x: it.x - 14, y: it.y - 26, w: 28, h: 26 })) continue;
      if (it.type === 'a') {
        if (p.ammo >= p.maxAmmo) continue;
        p.ammo = Math.min(p.maxAmmo, p.ammo + 12); Sfx.pickup(); floatText(it.x, it.y - 34, '+12 munição', '#ffe066', 14);
      } else {
        if (p.hp >= p.maxHp) continue;
        p.hp = Math.min(p.maxHp, p.hp + 35); Sfx.heal(); floatText(it.x, it.y - 34, '+35 vida', '#7dff8a', 14);
      }
      it.taken = true; it.t = 0;
      burst(it.x, it.y - 12, 10, it.type === 'a' ? '#ffe066' : '#7dff8a', 160, 0.4, 3, 200);
    }
  }
  dropKey(x, y) {
    this.keyItem = { x: clamp(x, this.arena.x0 + 40, this.arena.x1 - 80), y, vy: -420, landed: false, t: 0 };
    Sfx.key(); sparks(x, y, 12, '#ffd860');
  }
  onBossDefeated(d) { this.won = true; this.banner(d.name + ' derrotado!', '#7dff8a', 'Pegue a chave para abrir o portão'); }
  updateKeyGate(dt) {
    const k = this.keyItem, p = this.player, gx = this.level.AX + 920;
    if (k && !this.hasKey) {
      k.t += dt;
      if (!k.landed) {
        k.vy += 1400 * dt; k.y += k.vy * dt;
        if (k.y >= GROUND_Y - 16) { k.y = GROUND_Y - 16; k.landed = true; dust(k.x, GROUND_Y, 5, '#e8d890'); }
      }
      if (!p.dead && overlap(p.box(), { x: k.x - 16, y: k.y - 16, w: 32, h: 32 })) {
        this.hasKey = true; this.keyItem = null; Sfx.key(); this.flashScreen('Y', 0.08);
        this.banner('Chave obtida!', '#ffd860', 'Vá até o portão à direita');
      }
    }
    if (this.hasKey && !this.gateOpening && p.x + p.w > gx - 40) { this.gateOpening = true; Sfx.gate(); this.shake(3); }
    if (this.gateOpening && this.gateOpen < 1) this.gateOpen = Math.min(1, this.gateOpen + dt * 1.1);
    if (this.gateOpen >= 1 && p.x > gx + 4 && !p.dead) { this.state = 'clear'; this.stateT = 0; Sfx.pickup(); }
  }

  // ---------- Efeitos e câmera ----------
  updateFx(dt) {
    for (const q of this.parts) { q.life -= dt; q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.3, dt); }
    this.parts = this.parts.filter(q => q.life > 0);
    for (const tx of this.texts) { tx.life -= dt; tx.y -= 30 * dt; }
    this.texts = this.texts.filter(tx => tx.life > 0);
    for (const r of this.rings) { r.life -= dt; r.r += 520 * dt; }
    this.rings = this.rings.filter(r => r.life > 0);
    this.bannerT = Math.max(0, this.bannerT - dt); this.flashT = Math.max(0, this.flashT - dt);
    this.bossShow = approach(this.bossShow, Math.max(0, this.dino.hp), Math.max(60, this.dino.maxHp * 0.4) * dt);
    const p = this.player, L = this.level;
    const tx = this.fight ? L.AX : clamp(p.cx - W * 0.4 + p.face * 40, 0, L.AX);
    this.cam.x = lerp(this.cam.x, tx, 1 - Math.pow(0.002, dt));
    this.shakeMag *= Math.pow(0.01, dt);
    if (this.shakeMag < 0.3) this.shakeMag = 0;
    this.sx = rand(-1, 1) * this.shakeMag; this.sy = rand(-1, 1) * this.shakeMag;
  }
}

// =========================================================
//  JOGO: desenho no buffer de baixa resolução, HUD e telas
// =========================================================
const CYCLE = ['R', 'O', 'Y', 'G', 'C', 'B', 'P'];

Object.assign(Game.prototype, {
  flashScreen(col, t) { this.flashCol = col; this.flashT = Math.max(this.flashT || 0, t); },

  draw() {
    const L = this.level, title = this.state === 'title';
    const tt = title ? this.t : this.levelT;
    OX = 0; OY = 0;
    const fury = this.dino.phase2 && !this.dino.dead && this.state === 'play';
    L.drawBg(this.cam.x, this.t, this.flashT > 0 && !title ? this.flashCol : null, fury);
    OX = -Math.round(this.cam.x / SX) + Math.round(this.sx / SX); OY = Math.round(this.sy / SY);
    L.drawTerrain(tt, this.treeShake);
    this.drawGate();
    this.drawItems();
    for (const d of this.debris) this.drawDebrisShadow(d);
    if (!title) this.dino.draw();
    this.drawKey();
    if (this.state !== 'clear' && !title) this.player.draw();
    this.drawWaves();
    for (const b of this.bullets) {
      const x = bxW(b.x), y = byW(b.y);
      fr(x - 1, y, 2, 1, 'W'); fr(b.vx > 0 ? x - 3 : x + 1, y, 2, 1, 'Y');
    }
    for (const d of this.debris) this.drawDebris(d);
    this.drawParticles();
    for (const r of this.rings) if (r.life > 0.1) pring(bxW(r.x), byW(r.y), r.r / SX, r.r / SY, tog(r.life, 12) ? 'W' : 'Y');
    for (const t of this.texts) {
      if (t.life < 0.3 && tog(t.life, 16)) continue;
      text(t.text, bxW(t.x), byW(t.y) - 3, palOf(t.color));
    }
    OX = 0; OY = 0;
    if (!title) this.drawHUD();
    this.drawOverlay();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
  },

  drawGate() {
    const L = this.level, ax = L.AX, gx = ax + 920, top = GROUND_Y - 200;
    if (this.barrier > 0) {
      const by = lerp(-330, 0, easeOut(this.barrier));
      for (let i = 0; i < 3; i++) wrect(ax - 4 + i * 8, GROUND_Y - 230 + by + (i % 2) * 8, 8, 230 - (i % 2) * 8, i % 2 ? 'n' : 'N');
      wrect(ax - 6, GROUND_Y - 190 + by, 28, 5, 'S'); wrect(ax - 6, GROUND_Y - 70 + by, 28, 5, 'S');
    }
    wrect(gx - 6, top, 10, 200, 'D'); wrect(gx + 36, top, 10, 200, 'D');
    wrect(gx + 4, top + 20, 32, 180, 'Y');
    const lift = this.gateOpen * 182, dTop = top + 20, dBot = top + 200 - lift;
    if (dBot > dTop + 3) {
      wrect(gx + 4, dTop, 32, dBot - dTop, 'n');
      for (let i = 0; i < 2; i++) wrect(gx + 10 + i * 14, dTop, 6, dBot - dTop, 'N');
      for (const yy of [top + 60 - lift, top + 140 - lift]) if (yy > dTop) wrect(gx + 4, yy, 32, 4, 'K');
    }
    wrect(gx - 12, top - 4, 64, 26, 'L');
    wrect(gx + 14, top + 1, 12, 12, 'W');
    fr(bxW(gx + 16), byW(top + 5), 1, 1, 'K'); fr(bxW(gx + 22), byW(top + 5), 1, 1, 'K');
    if (!this.gateOpening) {
      wrect(gx + 14, GROUND_Y - 114, 12, 8, 'L');
      wrect(gx + 12, GROUND_Y - 106, 16, 14, 'Y');
      fr(bxW(gx + 20), byW(GROUND_Y - 100), 1, 2, 'K');
      if (this.hasKey && tog(this.t, 3)) text('PORTÃO →', bxW(gx - 60), byW(GROUND_Y - 130), 'Y');
    }
  },

  drawItems() {
    for (const it of this.level.items) {
      if (it.taken) continue;
      blit(it.type === 'a' ? BM.ammo : BM.med, bxW(it.x), byW(it.y) - 1 - tog(this.t * 1.5 + it.bob, 1));
    }
  },

  drawKey() {
    const k = this.keyItem;
    if (!k) return;
    const x = bxW(k.x), y = byW(k.y) + (k.landed ? tog(this.t, 2) : 0);
    blit(BM.key, x, y, 1, () => (tog(this.t, 8) ? 'Y' : 'W'));
    if (k.landed) {
      const ay = y - 12 - tog(this.t, 3);
      text('CHAVE', x, ay - 7, 'Y');
      fr(x - 2, ay, 5, 1, 'Y'); fr(x - 1, ay + 1, 3, 1, 'Y'); fr(x, ay + 2, 1, 1, 'Y');
    }
  },

  drawDebrisShadow(d) {
    const k = d.warn > 0 ? 1 - d.warn / d.max : 1, w = Math.round((12 + 16 * k) / SX);
    fr(bxW(d.x) - w, byW(d.land) - 1, w * 2 + 1, 1, tog(this.t, 10) ? 'R' : 'K');
  },
  drawDebris(d) {
    if (d.warn > 0) return;
    blit(d.kind === 'rock' ? BM.rock : BM.branch, bxW(d.x), byW(d.y), (Math.floor(d.rot * 2) & 1) ? -1 : 1);
  },
  drawWaves() {
    const cols = ['N', 'S', 'S', 'W'];
    for (const w of this.waves) {
      if (w.life < 0.3 && tog(w.life, 16)) continue;
      const x = bxW(w.x), y = GY + OY - 1;
      for (let i = 0; i < 4; i++) fr(x - 3 + i, y - 3 * i - 2, 7 - 2 * i, 3, cols[i]);
      fr(x - 2, y + 1, 5, 1, 'R');
    }
  },
  drawParticles() {
    for (const q of this.parts) {
      if (q.life < q.max * 0.3 && tog(q.life, 20)) continue;
      const s = q.size > 5 ? 2 : 1;
      fr(bxW(q.x), byW(q.y), s, s, palOf(q.color));
    }
  },

  drawHUD() {
    const p = this.player, d = this.dino;
    fr(0, 0, BW, 13, 'K');
    blit(BM.heart, 4, 5);
    const r = clamp(p.hp / p.maxHp, 0, 1);
    fr(9, 2, 42, 4, 'D');
    fr(10, 3, Math.round(40 * r), 2, r > 0.5 ? 'G' : r > 0.25 ? 'Y' : 'R');
    blit(BM.bullets, 4, 11);
    text(String(p.ammo), 9, 7, p.ammo > 0 ? 'W' : 'R', 'left', 1, null);
    blit(BM.knife, 22, 9);
    blit(BM.key, 40, 9, 1, () => (this.hasKey ? 'Y' : 'D'));
    if (Sfx.muted) text('SEM SOM (M)', 86, 7, 'L', 'center', 1, null);
    text('FASE ' + (this.levelIndex + 1) + '/' + LEVELS.length, 158, 1, 'W', 'right', 1, null);
    text(fmtTime(this.totalTime), 158, 7, 'Y', 'right', 1, null);
    if (this.fight && (!d.dead || d.deathT < 2.5)) {
      text(d.name + (d.phase2 ? ' - FÚRIA' : ''), 80, 16, d.phase2 ? 'O' : 'Y');
      fr(19, 23, 122, 4, 'D');
      fr(20, 24, Math.round(120 * this.bossShow / d.maxHp), 2, 'W');
      fr(20, 24, Math.round(120 * Math.max(0, d.hp) / d.maxHp), 2, d.phase2 ? 'O' : 'R');
      if (d instanceof TRex) fr(80, 22, 1, 6, 'W');
    }
    if (this.bannerT > 0 && (this.bannerT > 0.4 || tog(this.bannerT, 10))) {
      const sc = textW(this.bannerText.toUpperCase(), 2) <= BW - 4 ? 2 : 1, th = sc === 2 ? 14 : 9;
      const lines = this.bannerSub ? wrap(this.bannerSub.toUpperCase(), 38) : [];
      fr(0, 31, BW, th + lines.length * 8 + 5, 'K');
      text(this.bannerText, 80, 36, palOf(this.bannerCol), 'center', sc, null);
      lines.forEach((l, i) => text(l, 80, 36 + th + i * 8, 'W', 'center', 1, null));
    }
    if (this.state === 'play') {
      if (this.levelIndex === 0 && this.levelT < 9) {
        fr(0, 162, BW, 18, 'K');
        text('SETAS/A-D MOVER · ESPAÇO/W PULAR', 80, 165, 'W', 'center', 1, null);
        text('J ATIRAR · K FACA · P PAUSA · M SOM', 80, 173, 'W', 'center', 1, null);
      }
      if (p.stun > 0 && !p.dead && tog(this.t, 6)) text('ATORDOADO!', 80, 62, 'Y', 'center', 2);
    }
  },

  drawOverlay() {
    const blink = Math.sin(this.t * 5) > -0.3, L = this.level;
    switch (this.state) {
      case 'title': this.drawTitle(blink); break;
      case 'card': {
        const h = Math.round(clamp(Math.min(this.stateT, 2.6 - this.stateT) * 400, 0, 80));
        fr(0, 96 - (h >> 1), BW, h, 'K');
        if (h >= 80) {
          text('FASE ' + (this.levelIndex + 1), 80, 60, 'Y', 'center', 2, null);
          text(BOSS_NAMES[L.d.boss], 80, 76, 'W', 'center', 2, null);
          text(L.d.place, 80, 92, 'C', 'center', 1, null);
          wrap('ATRAVESSE A TRILHA, DERROTE O DINOSSAURO, PEGUE A CHAVE E ABRA O PORTÃO.', 38)
            .forEach((l, i) => text(l, 80, 104 + i * 8, 'L', 'center', 1, null));
        }
        break;
      }
      case 'paused':
        fr(14, 56, 132, 62, 'L'); fr(16, 58, 128, 58, 'K');
        text('PAUSADO', 80, 64, 'W', 'center', 2, null);
        text('P, ESC OU ENTER: CONTINUAR', 80, 84, 'Y', 'center', 1, null);
        text('R: RECOMEÇAR DO INÍCIO', 80, 94, 'L', 'center', 1, null);
        text('M: LIGA/DESLIGA O SOM', 80, 104, 'L', 'center', 1, null);
        break;
      case 'clear':
        fr(0, 70, BW, 36, 'K');
        text('FASE CONCLUÍDA!', 80, 76, tog(this.t, 4) ? 'G' : 'Y', 'center', 2, null);
        text('TEMPO TOTAL: ' + fmtTime(this.totalTime), 80, 94, 'W', 'center', 1, null);
        break;
      case 'gameover':
        if (this.stateT < 0.3) break;
        fr(0, 38, BW, 118, 'K');
        text('VOCÊ FOI DERROTADO', 80, 48, 'R', 'center', 2, null);
        text('FASE ' + (this.levelIndex + 1) + ' - ' + BOSS_NAMES[L.d.boss], 80, 66, 'L', 'center', 1, null);
        if (this.stateT > 0.5) {
          for (const b of this.btns) {
            const x = Math.round(b.x / SX), y = Math.round(b.y / SY), w = Math.round(b.w / SX), h = Math.round(b.h / SY);
            fr(x, y, w, h, 'L'); fr(x + 1, y + 1, w - 2, h - 2, 'D');
            text(b.label, x + w / 2, y + 5, 'W');
            text('[' + b.key + ']', x + w / 2, y + 13, 'Y');
          }
        }
        break;
      case 'victory': {
        fr(0, 0, BW, BH, 'K');
        for (let i = 0; i < 24; i++) {
          const x = (i * 37 + 11) % BW, y = Math.floor(this.t * (18 + (i % 5) * 6) + i * 53) % BH;
          fr(x, y, 1, 1, CYCLE[(i + Math.floor(this.t * 6)) % CYCLE.length]);
        }
        const c0 = Math.floor(this.t * 8);
        text('VOCÊ ESCAPOU', 80, 12, CYCLE[c0 % 7], 'center', 2, null);
        text('DA ILHA!', 80, 28, CYCLE[(c0 + 3) % 7], 'center', 2, null);
        text('OS CINCO DINOSSAUROS FORAM VENCIDOS', 80, 46, 'L', 'center', 1, null);
        text('E O ÚLTIMO PORTÃO SE ABRIU.', 80, 54, 'L', 'center', 1, null);
        text('TEMPO TOTAL', 80, 68, 'W', 'center', 1, null);
        text(fmtTime(this.totalTime), 80, 77, 'W', 'center', 2, null);
        text('MELHOR TEMPO: ' + fmtTime(this.best), 80, 96, 'G', 'center', 1, null);
        if (this.newRecord) text('NOVO RECORDE!', 80, 108, blink ? 'G' : 'Y', 'center', 2, null);
        if (this.stateT > 1 && blink) text(this.touch ? 'TOQUE PARA VOLTAR AO INÍCIO' : 'PRESSIONE ENTER PARA VOLTAR AO INÍCIO', 80, 134, 'W', 'center', 1, null);
        text('CRIADO POR NICKOLAS REIS', 80, 166, 'C', 'center', 1, null);
        break;
      }
    }
  },

  drawTitle(blink) {
    fr(0, 0, BW, 116, 'K');
    const c0 = Math.floor(this.t * 10);
    for (let i = 0; i < BW; i += 4) { fr(i, 0, 4, 2, CYCLE[(i / 4 + c0) % 7]); fr(i, 114, 4, 2, CYCLE[(i / 4 + c0 + 3) % 7]); }
    const T = 'FUGA JURÁSSICA', x0 = Math.round(80 - textW(T, 2) / 2), c1 = Math.floor(this.t * 8);
    for (let i = 0; i < T.length; i++) text(T[i], x0 + i * 8, 8, CYCLE[(i + c1) % 7], 'left', 2, null);
    text('EDIÇÃO CLÁSSICA 8-BIT', 80, 23, 'O', 'center', 1, null);
    text('ESCAPE DA ILHA E VENÇA 5 DINOSSAUROS', 80, 32, 'L', 'center', 1, null);
    const lines = [
      ['SETAS A D', 'MOVER'],
      ['ESPAÇO W ↑', 'PULAR'],
      ['J', 'ATIRAR (MUNIÇÃO)'],
      ['K', 'FACA (SEM LIMITE)'],
      ['P ESC', 'PAUSAR'],
      ['M', 'LIGA/DESLIGA SOM']
    ];
    lines.forEach((l, i) => {
      text(l[0], 66, 44 + i * 8, 'Y', 'right', 1, null);
      text(l[1], 72, 44 + i * 8, 'W', 'left', 1, null);
    });
    if (blink) text(this.touch ? 'TOQUE NA TELA PARA COMEÇAR' : 'PRESSIONE ENTER PARA COMEÇAR', 80, 94, 'G', 'center', 1, null);
    text(this.best ? 'MELHOR TEMPO: ' + fmtTime(this.best) : 'MELHOR TEMPO: --:--.-', 8, 104, 'L', 'left', 1, null);
    const r = this.titleRex;
    r.anim = this.t;
    Pen.raw(142, GY - 1, -1);
    r.drawBody();
    fr(0, 166, BW, 14, 'K');
    text('CRIADO POR NICKOLAS REIS', 80, 170, 'C', 'center', 1, null);
  }
});

// =========================================================
//  INICIALIZAÇÃO: tela, toque e laço principal (passo fixo)
// =========================================================
// Escala com colunas inteiras (pixel largo 2:1), sem suavização
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight, dpr = Math.min(window.devicePixelRatio || 1, 3);
  const k = Math.min(vw * dpr / (BW * 2), vh * dpr / BH);
  const kx = k >= 1 ? Math.floor(k * 2) : k * 2;
  canvas.width = Math.max(1, Math.round(BW * kx)); canvas.height = Math.max(1, Math.round(BH * kx / 2));
  canvas.style.width = (canvas.width / dpr) + 'px'; canvas.style.height = (canvas.height / dpr) + 'px';
}
window.addEventListener('resize', resize);
resize();

G = new Game();
G.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
if (G.touch) document.getElementById('touch').classList.add('on');

document.querySelectorAll('.tb').forEach(el => {
  const a = el.dataset.a;
  const down = e => {
    e.preventDefault(); Sfx.init(); el.classList.add('act');
    if (a === 'pause') { if (G.state === 'play') G.pause(); else if (G.state === 'paused') G.state = 'play'; }
    else Input.set(a, true);
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignorado */ }
  };
  const up = e => { e.preventDefault(); el.classList.remove('act'); if (a !== 'pause') Input.set(a, false); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  G.tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  canvas.focus();
});

let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { G.update(STEP); Input.endStep(); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  G.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
