<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="author" content="Nickolas Reis">
<title>Fuga Jurássica 8-bit</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; outline: none; image-rendering: crisp-edges; image-rendering: pixelated; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 68px; height: 68px;
    background: rgba(0,0,0,.5); border: 4px solid #a8a8a8; color: #fce050;
    font: bold 14px "Courier New", monospace; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  .tb.act { background: #d82800; border-color: #fce050; color: #ececec; }
  #bL { left: 16px; bottom: 20px; }
  #bR { left: 100px; bottom: 20px; }
  #bJ { right: 16px; bottom: 20px; width: 84px; height: 84px; }
  #bS { right: 112px; bottom: 20px; }
  #bK { right: 112px; bottom: 104px; }
  #bP { left: 50%; bottom: 18px; transform: translateX(-50%); width: 48px; height: 48px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="180" tabindex="0"></canvas></div>
<div id="touch">
  <div class="tb" id="bL" data-a="left">&#9664;</div>
  <div class="tb" id="bR" data-a="right">&#9654;</div>
  <div class="tb" id="bK" data-a="knife">FACA</div>
  <div class="tb" id="bS" data-a="shoot">TIRO</div>
  <div class="tb" id="bJ" data-a="jump">PULO</div>
  <div class="tb" id="bP" data-a="pause">II</div>
</div>
<script>
'use strict';
/* =========================================================
   FUGA JURÁSSICA - EDIÇÃO CLÁSSICA 8-BIT
   Mesma jogabilidade da versão original, apresentada como num console
   caseiro do fim dos anos 70: buffer de 160x180 com pixel largo (2:1),
   paleta fixa, sprites em bitmap, fonte de 3x5 e sons de onda quadrada.
   A lógica do jogo continua em coordenadas do "mundo" (960x540).
   ========================================================= */

// ---------- Constantes e utilidades ----------
const W = 960, H = 540, GROUND_Y = 460, GRAV = 2000, STEP = 1 / 60;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let G = null; // instância do jogo (criada no fim do script)

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sign = v => (v < 0 ? -1 : 1);
const approach = (v, target, amt) => (v < target ? Math.min(v + amt, target) : Math.max(v - amt, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pointIn = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
}
function rotAround(px, py, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a), dx = px - cx, dy = py - cy;
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}

// Armazenamento local sempre protegido (pode estar bloqueado)
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignorado */ } }
};

// ---------- Áudio (WebAudio procedural) ----------
const Sfx = {
  ac: null, master: null, noiseBuf: null, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.24;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  tone(freq, dur, type = 'square', vol = 0.3, slideTo = null, delay = 0) {
    if (!this.ac || this.muted) return;
    try {
      const t = this.ac.currentTime + delay;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignorado */ }
  },
  noise(dur, vol = 0.3, freq = 1000, q = 1, type = 'lowpass', delay = 0, slideTo = null) {
    if (!this.ac || this.muted || !this.noiseBuf) return;
    try {
      const t = this.ac.currentTime + delay;
      const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ac.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = this.ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master);
      s.start(t); s.stop(t + dur + 0.02);
    } catch (e) { /* ignorado */ }
  },
  shoot() { this.tone(880, 0.07, 'square', 0.12, 220); this.noise(0.06, 0.22, 3000, 0.7, 'highpass'); },
  knife() { this.noise(0.09, 0.22, 2400, 1, 'bandpass', 0, 6000); this.tone(1400, 0.04, 'square', 0.06, 700); },
  hit() { this.tone(180, 0.1, 'square', 0.16, 70); this.noise(0.06, 0.22, 1200); },
  slash() { this.tone(160, 0.14, 'square', 0.16, 60); this.noise(0.1, 0.3, 1600, 1, 'lowpass', 0, 300); },
  deflect() { this.tone(1760, 0.06, 'square', 0.1); this.tone(2640, 0.06, 'square', 0.08, null, 0.05); },
  thud() { this.noise(0.1, 0.3, 300); this.tone(70, 0.08, 'square', 0.12, 40); },
  jump() { this.tone(260, 0.12, 'square', 0.08, 620); },
  land() { this.noise(0.04, 0.12, 500); },
  pickup() { [523, 784, 1047].forEach((f, i) => this.tone(f, 0.08, 'square', 0.1, null, i * 0.06)); },
  heal() { [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.08, 'square', 0.1, null, i * 0.06)); },
  hurt() { this.tone(300, 0.2, 'square', 0.16, 70); this.noise(0.12, 0.2, 700); },
  roar(big) {
    const d = big ? 1.1 : 0.6;
    this.noise(d, 0.45, big ? 500 : 900, 1.2, 'lowpass', 0, 110);
    this.tone(big ? 70 : 110, d, 'square', 0.12, big ? 40 : 60);
  },
  stomp() { this.tone(60, 0.35, 'square', 0.25, 30); this.noise(0.35, 0.4, 260, 1, 'lowpass', 0, 60); },
  crash() { this.tone(100, 0.25, 'square', 0.22, 40); this.noise(0.3, 0.45, 900, 0.7, 'lowpass', 0, 120); },
  key() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.1, 'square', 0.1, null, i * 0.07)); },
  gate() { for (let i = 0; i < 6; i++) this.tone(110 + i * 20, 0.08, 'square', 0.1, null, i * 0.09); this.noise(0.6, 0.15, 400); },
  die() { [392, 330, 262, 196, 131].forEach((f, i) => this.tone(f, 0.16, 'square', 0.14, null, i * 0.14)); },
  dinoDie() { this.tone(200, 0.9, 'square', 0.16, 40); this.noise(0.8, 0.3, 700, 1, 'lowpass', 0, 100); },
  empty() { this.tone(150, 0.04, 'square', 0.07); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.16, 'square', 0.1, null, i * 0.13)); }
};

// ---------- Entrada (teclado + toque) ----------
const Input = {
  held: {}, pressed: {},
  map: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', KeyW: 'jump', ArrowUp: 'jump', KeyJ: 'shoot', KeyK: 'knife',
    KeyP: 'pause', Escape: 'pause', Enter: 'enter', NumpadEnter: 'enter', KeyR: 'restart', KeyM: 'mute'
  },
  set(action, down) {
    if (down && !this.held[action]) this.pressed[action] = true;
    this.held[action] = down;
  },
  take(action) {
    if (this.pressed[action]) { this.pressed[action] = false; return true; }
    return false;
  },
  endStep() { this.pressed = {}; },
  clearAll() { this.held = {}; this.pressed = {}; }
};
window.addEventListener('keydown', e => {
  Sfx.init();
  const a = Input.map[e.code];
  if (a) { e.preventDefault(); if (!e.repeat) Input.set(a, true); }
});
window.addEventListener('keyup', e => {
  const a = Input.map[e.code];
  if (a) { e.preventDefault(); Input.set(a, false); }
});
window.addEventListener('blur', () => {
  Input.clearAll();
  if (G && G.state === 'play') G.pause();
});

// ---------- Efeitos: partículas e textos ----------
function addPart(x, y, vx, vy, life, color, size, grav = 0, kind = 'sq') {
  if (G.parts.length > 600) return;
  G.parts.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function burst(x, y, n, color, spd = 200, life = 0.5, size = 3, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(life * 0.5, life), color, rand(size * 0.6, size * 1.3), grav);
  }
}
function dust(x, y, n, color = '#b9a27a', spread = 1) {
  for (let i = 0; i < n; i++) {
    addPart(x + rand(-10, 10) * spread, y - 2, rand(-120, 120) * spread, rand(-170, -30), rand(0.4, 0.8), color, rand(3, 7), 300, 'circ');
  }
}
function sparks(x, y, n, color = '#ffd860') {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(150, 420);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.15, 0.35), color, rand(1.5, 3), 400, 'line');
  }
}
function floatText(x, y, text, color = '#fff', size = 16) {
  G.texts.push({ x, y, text, color, size, life: 1.1, max: 1.1 });
}

// =========================================================
//  VÍDEO 8-BIT: buffer de baixa resolução, paleta fixa, fonte e sprites
// =========================================================
const BW = 160, BH = 180, SX = W / BW, SY = H / BH; // 1 pixel = 6 x 3 unidades do mundo (pixel largo 2:1)
const GY = Math.round(GROUND_Y / SY);               // linha do chão no buffer
const PAL = {
  K: '#000000', W: '#ececec', L: '#a8a8a8', D: '#585858',
  R: '#d82800', M: '#7c1800', O: '#fc8c20', Y: '#fce050',
  G: '#80d010', E: '#30902c', F: '#105c18', N: '#a86c28',
  n: '#5c3c10', S: '#fcb880', B: '#2c58d8', C: '#74b4fc', P: '#7838a8'
};
const buf = document.createElement('canvas'); buf.width = BW; buf.height = BH;
const bc = buf.getContext('2d');
let OX = 0, OY = 0; // deslocamento mundo -> buffer (câmera + tremor), em pixels
const bxW = x => Math.round(x / SX) + OX;
const byW = y => Math.round(y / SY) + OY;
const qph = ph => Math.PI / 4 + (Math.floor(ph / Math.PI) & 1) * Math.PI; // fase de passada em 2 quadros
const tog = (t, hz) => Math.floor(t * hz) & 1;

function fr(x, y, w, h, col) {
  if (w > 0 && h > 0) { bc.fillStyle = PAL[col] || col; bc.fillRect(x, y, w, h); }
}
function wrect(x, y, w, h, col) {
  const a = bxW(x), b = byW(y);
  fr(a, b, Math.max(1, bxW(x + w) - a), Math.max(1, byW(y + h) - b), col);
}
// Elipse em degraus; half: -1 só a metade de cima, 1 só a de baixo
function pell(cx, cy, rx, ry, col, half = 0) {
  for (let dy = half > 0 ? 0 : -ry; dy <= (half < 0 ? 0 : ry); dy++) {
    const k = ry ? dy / (ry + 0.5) : 0, hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - k * k)));
    fr(cx - hw, cy + dy, hw * 2 + 1, 1, col);
  }
}
function pring(cx, cy, rx, ry, col) {
  const n = Math.max(12, Math.ceil((rx + ry) * 3));
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    fr(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1, col);
  }
}
function stars(x, y, t, r) {
  for (let i = 0; i < 3; i++) {
    const a = t * 5 + i * 2.094;
    fr(Math.round(x + Math.cos(a) * r), Math.round(y + Math.sin(a)), 1, 1, i ? 'Y' : 'W');
  }
}

// Cores livres (partículas, textos flutuantes) caem na cor mais próxima da paleta
const PAL_RGB = Object.keys(PAL).map(k => [k, parseInt(PAL[k].slice(1, 3), 16), parseInt(PAL[k].slice(3, 5), 16), parseInt(PAL[k].slice(5, 7), 16)]);
const CMAP = { '#fff': 'W', '#ffffff': 'W', '#ff6a5a': 'R', '#ff9a7a': 'O', '#d0e0ff': 'C', '#7dff8a': 'G', '#ff6a3a': 'O' };
function palOf(c) {
  if (PAL[c]) return c;
  if (CMAP[c]) return CMAP[c];
  const r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
  let best = 'W', bd = 1e9;
  for (const [k, R, G2, B] of PAL_RGB) {
    const d = (r - R) * (r - R) + (g - G2) * (g - G2) + (b - B) * (b - B);
    if (d < bd) { bd = d; best = k; }
  }
  CMAP[c] = best;
  return best;
}

// ---------- Bitmaps: cada letra é uma cor da paleta, '.' é transparente ----------
function bm(rows, ax, ay) {
  const runs = [];
  rows.forEach((r, y) => {
    let x = 0;
    while (x < r.length) {
      const ch = r[x];
      if (ch === '.') { x++; continue; }
      let n = 1;
      while (r[x + n] === ch) n++;
      runs.push([x, y, n, ch]); x += n;
    }
  });
  const w = Math.max(...rows.map(r => r.length));
  return { w, h: rows.length, runs, ax: ax === undefined ? w >> 1 : ax, ay: ay === undefined ? rows.length - 1 : ay };
}
// Desenha o bitmap com o pixel-âncora em (x,y); f espelha, s achata na horizontal, vflip vira de cabeça para baixo
function blit(b, x, y, f = 1, cf = null, s = 1, vflip = false) {
  const k = f * s;
  for (const [c, r, n, ch] of b.runs) {
    let a = (c - b.ax) * k, e = (c + n - b.ax) * k;
    if (k < 0) { a += 1; e += 1; }
    const x0 = Math.round(Math.min(a, e));
    let x1 = Math.round(Math.max(a, e));
    if (x1 <= x0) x1 = x0 + 1;
    fr(x + x0, y + (vflip ? b.ay - r : r - b.ay), x1 - x0, 1, cf ? cf(ch) : ch);
  }
}

const P_TOP = ['..NNN..', '.NNNNN.', '..SSS..', '..SSK..', '..SSS..', '.nBBB..', '.nBBB..', '.nBBB..', '..BBB..', '..KKK..'];
const P_LEGS = {
  stand: ['..D.D..', '..D.D..', '..D.D..', '..D.D..', '..D.D..', '..KKKK.'],
  runA: ['..DDD..', '..D..D.', '.D...D.', '.D....D', 'D.....D', 'KK....KK'],
  runB: ['..DD...', '..D.D..', '..D..D.', '..D.DK.', '..D....', '..KK...'],
  jump: ['..DDD..', '.DD.DD.', '.D...D.', '.KK..KK', '', '']
};
// Braço da frente: [dx a partir do centro, linha do sprite, cor]
const ARM = {
  idle: [[2, 6, 'B'], [2, 7, 'B'], [2, 8, 'S'], [2, 9, 'D']],
  swing: [[2, 6, 'B'], [3, 7, 'B'], [3, 8, 'S'], [3, 9, 'D']],
  aim: [[2, 6, 'B'], [3, 6, 'B'], [4, 6, 'S'], [5, 6, 'D'], [6, 6, 'D'], [5, 7, 'D']],
  flash: [[7, 6, 'Y'], [8, 6, 'W'], [7, 5, 'Y'], [7, 7, 'Y']],
  knifeUp: [[2, 5, 'B'], [2, 4, 'B'], [2, 3, 'S'], [2, 2, 'W'], [2, 1, 'W'], [2, 0, 'W']],
  knifeFwd: [[2, 7, 'B'], [3, 7, 'B'], [4, 7, 'S'], [5, 7, 'W'], [6, 7, 'W'], [7, 7, 'W']],
  swoosh: [[4, 1, 'W'], [5, 2, 'W'], [6, 3, 'W'], [7, 4, 'Y'], [7, 5, 'Y'], [8, 6, 'Y'], [8, 7, 'W'], [7, 9, 'W'], [6, 10, 'W']]
};
// Corpo deitado (derrotado): gira o sprite em pé e pega uma linha sim, outra não
function lyingRows(rows) {
  const out = [];
  for (let i = 0; i < 7; i++) {
    let s = '';
    for (let j = 0; j < 8; j++) s += (rows[j * 2] || '')[6 - i] || '.';
    out.push(s);
  }
  return out;
}
const REX_HEAD = ['.....NNNNN....', '...NNNnNNNNN..', '..NNNNYNNNNNN.', '.NNNNNNNNNNNNN', 'NNNNNNNNNNNNNN',
  'NNNNNNNNNNNNNN', 'NNNWWWWWWWWWN.', 'NnnnnnnnnnnnN.', '.nnnnnnnnnnn..', '..nnnnnnnn....'];
const REX_HEAD_OPEN = ['.....NNNNN....', '...NNNnNNNNN..', '..NNNNYNNNNNN.', '.NNNNNNNNNNNNN', 'NNNNNNNNNNNNNN',
  'NNNWWWWWWWWWNN', 'NNKKKKKKKKK...', 'NnKKKKKKKK....', '.nnKKKKKKK....', '.nnWWWWWWW....', '..nnnnnnnnn...', '...nnnnnnn....'];
const PACHY_HEAD = ['..SSS..', '.SSSSS.', 'NSSSSSN', 'NSSSSS.', '.NEEKE.', '..EEEEE', '...EEE.'];
const BM = {
  pStand: bm(P_TOP.concat(P_LEGS.stand), 3),
  pRunA: bm(P_TOP.concat(P_LEGS.runA), 3),
  pRunB: bm(P_TOP.concat(P_LEGS.runB), 3),
  pJump: bm(P_TOP.concat(P_LEGS.jump), 3, 15),
  pDead: bm(lyingRows(P_TOP.concat(P_LEGS.stand)), 4, 6),
  raptorHead: bm(['.NNN...', 'NNNYNNN', 'NNNNNNN', '.nnnnn.'], 1, 2),
  raptorHeadOpen: bm(['.NNN...', 'NNNYNNN', 'NN.W.W.', 'Nn.....', '.nW.W..', '..nnnn.'], 1, 2),
  ankyHead: bm(['..NNNN..', '.NNNNNN.', 'SSSSSKS.', 'SSSSSSSS', 'SSSSSSS.', '.SSSSS..'], 3, 3),
  pachyHead: bm(PACHY_HEAD, 3, 4),
  pachyHeadStun: bm(PACHY_HEAD.map(r => r.replace('K', 'W')), 3, 4),
  pachyHeadLow: bm(['...SSS.', '..SSSSS', '.NSSSSS', '.NSSSSS', '.EKSSS.', '.EEEN..', '..EE...'], 3, 4),
  brachioHead: bm(['..GGG....', '.GGGGG...', 'GGGKGGGGG', 'GGGGGGGGG', '.GGEEEEEE', '..GGGGGG.'], 3, 3),
  rexHead: bm(REX_HEAD, 5, 6),
  rexHeadOpen: bm(REX_HEAD_OPEN, 5, 6),
  ammo: bm(['Y.Y.Y', 'Y.Y.Y', 'NNNNN', 'NnnnN', 'NNNNN', 'NnnnN', 'NNNNN']),
  med: bm(['.WWW.', 'WWEWW', 'WEEEW', 'WWEWW', 'WWWWW']),
  key: bm(['YYY....', 'Y.YYYYY', 'YYY.Y.Y'], 3, 1),
  heart: bm(['RR.RR', 'RRRRR', '.RRR.', '..R..']),
  bullets: bm(['Y.Y.Y', 'Y.Y.Y', 'N.N.N']),
  knife: bm(['WWWWnn', '....n.'], 0, 0),
  fern1: bm(['X.X.X', '.XXX.', '..X..']),
  fern2: bm(['.X.X.', 'XXXXX', '..X..']),
  rock: bm(['.LL.', 'LLLD', 'LLDD', '.DD.'], 2, 2),
  branch: bm(['.E...E', 'nnnnnn', 'E..E..'], 3, 1)
};

// ---------- Fonte 3x5 (cada linha = 3 bits) com acentos do português ----------
const FONT3 = {
  A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7],
  F: [7, 4, 6, 4, 4], G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2],
  K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7], M: [5, 7, 7, 5, 5], N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2],
  P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 6, 3], R: [6, 5, 6, 5, 5], S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2],
  U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5], Y: [5, 5, 2, 2, 2],
  Z: [7, 1, 2, 4, 7],
  0: [7, 5, 5, 5, 7], 1: [2, 6, 2, 2, 7], 2: [6, 1, 2, 4, 7], 3: [6, 1, 2, 1, 6], 4: [5, 5, 7, 1, 1],
  5: [7, 4, 6, 1, 6], 6: [3, 4, 7, 5, 7], 7: [7, 1, 1, 2, 2], 8: [7, 5, 7, 5, 7], 9: [7, 5, 7, 1, 6],
  ' ': [0, 0, 0, 0, 0], '.': [0, 0, 0, 0, 2], ',': [0, 0, 0, 2, 4], ':': [0, 2, 0, 2, 0], '!': [2, 2, 2, 0, 2],
  '?': [6, 1, 2, 0, 2], '-': [0, 0, 7, 0, 0], '—': [0, 0, 7, 0, 0], '+': [0, 2, 7, 2, 0], '/': [1, 1, 2, 4, 4],
  '(': [1, 2, 2, 2, 1], ')': [4, 2, 2, 2, 4], '[': [3, 2, 2, 2, 3], ']': [6, 2, 2, 2, 6], '·': [0, 0, 2, 0, 0],
  '→': [2, 1, 7, 1, 2], '↑': [2, 7, 2, 2, 2], "'": [2, 2, 0, 0, 0], '%': [5, 1, 2, 4, 5], '=': [0, 7, 0, 7, 0]
};
const ACC = { 'Á': ['A', 'a'], 'À': ['A', 'g'], 'Â': ['A', 'c'], 'Ã': ['A', 't'], 'É': ['E', 'a'], 'Ê': ['E', 'c'],
  'Í': ['I', 'a'], 'Ó': ['O', 'a'], 'Ô': ['O', 'c'], 'Õ': ['O', 't'], 'Ú': ['U', 'a'], 'Ü': ['U', 'u'], 'Ç': ['C', 'd'] };
const ACCM = { a: [[2, -2], [1, -1]], g: [[0, -2], [1, -1]], c: [[1, -2], [0, -1], [2, -1]],
  t: [[1, -2], [2, -2], [0, -1], [1, -1]], u: [[0, -1], [2, -1]], d: [[1, 5]] };
const textW = (s, sc = 1) => String(s).length * 4 * sc - sc;
function drawStr(s, x, y, col, sc) {
  bc.fillStyle = PAL[col] || col;
  for (const ch of s) {
    const [base, acc] = ACC[ch] || [ch, null];
    const g = FONT3[base] || FONT3['?'];
    for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r] & (4 >> c)) bc.fillRect(x + c * sc, y + r * sc, sc, sc);
    if (acc) for (const [c, r] of ACCM[acc]) bc.fillRect(x + c * sc, y + r * sc, sc, sc);
    x += 4 * sc;
  }
}
// y = topo da letra (acentos ficam nas 2 linhas acima); sombra preta deslocada
function text(s, x, y, col, align = 'center', sc = 1, sh = 'K') {
  s = String(s).toUpperCase();
  const w = textW(s, sc);
  const x0 = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w + 1 : x);
  if (sh) drawStr(s, x0 + sc, y + sc, sh, sc);
  drawStr(s, x0, y, col, sc);
}
function wrap(s, max) {
  const out = [];
  let line = '';
  for (const w of String(s).split(' ')) {
    if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else line = line ? line + ' ' + w : w;
  }
  if (line) out.push(line);
  return out;
}

// ---------- "Caneta" dos dinossauros: coordenadas locais do mundo -> pixels ----------
// Reaproveita a geometria do jogo original (mesmos pontos das caixas de colisão),
// mas traça tudo com blocos chapados.
const Pen = {
  X: 0, Y: 0, f: 1, s: 1, vs: 1, pv: 0, fl: false, map: null,
  at(wx, wy, face, o) { this.raw(bxW(wx), byW(wy) - 1, face, o); },
  raw(X, Y, face, o = {}) {
    this.X = X; this.Y = Y; this.f = face; this.s = 1; this.vs = o.vs === undefined ? 1 : o.vs;
    this.pv = o.pv || 0; this.fl = !!o.flash; this.map = null;
  },
  c(col) { return this.fl ? 'W' : (this.map && this.map[col]) || col; },
  x(lx) { return this.X + Math.round(this.f * this.s * lx / SX); },
  y(ly) { return this.Y + Math.round((this.pv + (ly - this.pv) * this.vs) / SY); },
  rect(lx, ly, w, h, col) {
    const a = this.x(lx), b = this.x(lx + w), c = this.y(ly), d = this.y(ly + h);
    fr(Math.min(a, b), Math.min(c, d), Math.max(1, Math.abs(b - a)), Math.max(1, Math.abs(d - c)), this.c(col));
  },
  ell(lx, ly, rx, ry, col, top) {
    pell(this.x(lx), this.y(ly), Math.round(Math.abs(rx * this.s) / SX), Math.round(Math.abs(ry * this.vs) / SY),
      this.c(col), top ? (this.vs < 0 ? 1 : -1) : 0);
  },
  dot(lx, ly, w, h, col) {
    const pw = Math.max(1, Math.round(Math.abs(w * this.s) / SX)), ph = Math.max(1, Math.round(Math.abs(h * this.vs) / SY));
    fr(this.x(lx) - (pw >> 1), this.y(ly) - (ph >> 1), pw, ph, this.c(col));
  },
  seg(x0, y0, x1, y1, w0, w1, col) {
    const n = Math.max(2, Math.ceil(Math.max(Math.abs(x1 - x0) / SX, Math.abs(y1 - y0) / SY)));
    for (let i = 0; i <= n; i++) {
      const t = i / n, w = w0 + (w1 - w0) * t;
      this.dot(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w, w, col);
    }
  },
  curve(x0, y0, cx, cy, x1, y1, w0, w1, col) {
    const n = Math.max(4, Math.ceil((Math.abs(cx - x0) + Math.abs(x1 - cx)) / SX + (Math.abs(cy - y0) + Math.abs(y1 - cy)) / SY));
    for (let i = 0; i <= n; i++) {
      const t = i / n, m = 1 - t, w = w0 + (w1 - w0) * t;
      this.dot(m * m * x0 + 2 * m * t * cx + t * t * x1, m * m * y0 + 2 * m * t * cy + t * t * y1, w, w, col);
    }
  },
  leg(hx, hy, fx, fy, len, bend, w1, w2, col) {
    const dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 1, a = len / 2;
    let kx = (hx + fx) / 2, ky = (hy + fy) / 2;
    if (d < len) {
      const h = Math.sqrt(Math.max(0, a * a - (d / 2) * (d / 2)));
      kx += (-dy / d) * h * bend; ky += (dx / d) * h * bend;
    }
    this.seg(hx, hy, kx, ky, w1, w1, col); this.seg(kx, ky, fx, fy, w2, w2, col);
  },
  ring(lx, ly, rx, ry, col) {
    pring(this.x(lx), this.y(ly), Math.abs(rx * this.s) / SX, Math.abs(ry * this.vs) / SY, this.c(col));
  },
  spr(b, lx, ly, col) { blit(b, this.x(lx), this.y(ly), this.f, ch => this.c(col || ch), this.s, this.vs < 0); }
};

// =========================================================
//  JOGADOR
// =========================================================
class Player {
  constructor() {
    this.maxHp = 100; this.hp = 100; this.ammo = 15; this.maxAmmo = 40;
    this.reset(80, GROUND_Y - 46);
  }
  reset(x, y) {
    this.x = x; this.y = y; this.w = 22; this.h = 46; this.vx = 0; this.vy = 0; this.face = 1;
    this.onGround = false; this.standSolid = false; this.jumping = false;
    this.inv = 0; this.shootCd = 0; this.knifeT = 0; this.knifeCd = 0; this.knifeHit = false;
    this.coyote = 0; this.jumpBuf = 0; this.stun = 0; this.lock = 0;
    this.anim = 0; this.t = 0; this.muzzle = 0; this.aimT = 0; this.emptyT = 0;
    this.safeX = x; this.safeY = y; this.dead = false; this.deadT = 0;
  }
  get cx() { return this.x + this.w / 2; }
  box() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  knifeBox() { return { x: this.face > 0 ? this.x + this.w - 4 : this.x - 38, y: this.y + 2, w: 42, h: 34 }; }

  update(dt) {
    this.t += dt;
    if (this.dead) {
      this.deadT += dt; this.vy = Math.min(this.vy + GRAV * dt, 1100);
      this.vx = approach(this.vx, 0, 600 * dt); this.moveAndCollide(dt); return;
    }
    this.inv = Math.max(0, this.inv - dt); this.stun = Math.max(0, this.stun - dt);
    this.lock = Math.max(0, this.lock - dt); this.muzzle = Math.max(0, this.muzzle - dt);
    this.aimT = Math.max(0, this.aimT - dt); this.emptyT -= dt;
    this.shootCd -= dt; this.knifeCd -= dt;
    const can = this.stun <= 0 && this.lock <= 0;

    // Movimento horizontal
    let mv = 0;
    if (can) { if (Input.held.left) mv -= 1; if (Input.held.right) mv += 1; }
    if (mv) {
      this.vx = approach(this.vx, mv * 270, (this.onGround ? 2600 : 1600) * dt);
      if (this.knifeT <= 0) this.face = mv;
    } else if (this.lock <= 0) {
      this.vx = approach(this.vx, 0, (this.onGround ? 2400 : 700) * dt);
    }

    // Pulo com buffer e "coyote time"
    if (Input.take('jump')) this.jumpBuf = 0.12; else this.jumpBuf -= dt;
    this.coyote = this.onGround ? 0.09 : this.coyote - dt;
    if (can && this.jumpBuf > 0 && this.coyote > 0) {
      this.vy = -730; this.jumpBuf = 0; this.coyote = 0; this.onGround = false; this.jumping = true;
      Sfx.jump(); dust(this.cx, this.y + this.h, 4);
    }
    if (this.jumping && !Input.held.jump && this.vy < -280) this.vy = -280;
    if (this.vy >= 0) this.jumping = false;

    // Ataques
    if (can) {
      if (Input.held.shoot && this.shootCd <= 0 && this.knifeT <= 0) {
        if (this.ammo > 0) {
          this.ammo--; this.shootCd = 0.24; this.aimT = 0.35; G.fireBullet(this);
        } else {
          this.shootCd = 0.3; Sfx.empty();
          if (this.emptyT <= 0) { floatText(this.cx, this.y - 12, 'Sem munição! Use a faca', '#ff9a7a', 13); this.emptyT = 1.5; }
        }
      }
      if ((Input.take('knife') || Input.held.knife) && this.knifeCd <= 0) {
        this.knifeT = 0.22; this.knifeCd = 0.42; this.knifeHit = false; Sfx.knife();
      }
    }
    if (this.knifeT > 0) {
      this.knifeT -= dt;
      const ph = 0.22 - this.knifeT;
      if (ph > 0.04 && ph < 0.16 && !this.knifeHit) G.knifeCheck(this);
    }

    this.vy = Math.min(this.vy + GRAV * dt, 1100);
    const wasG = this.onGround, fallV = this.vy;
    this.moveAndCollide(dt);
    if (this.onGround && !wasG && fallV > 450) { dust(this.cx, this.y + this.h, 4); Sfx.land(); }
    if (this.onGround && this.standSolid && G.isSafe(this)) { this.safeX = this.x; this.safeY = this.y; }
    this.anim += dt * (this.onGround ? Math.abs(this.vx) / 30 : 0);
  }

  moveAndCollide(dt) {
    const solids = G.solids();
    this.x += this.vx * dt;
    for (const s of solids) {
      if (overlap(this, s)) {
        if (this.vx > 0) this.x = s.x - this.w;
        else if (this.vx < 0) this.x = s.x + s.w;
        else if (this.x + this.w / 2 < s.x + s.w / 2) this.x = s.x - this.w;
        else this.x = s.x + s.w;
        this.vx = 0;
      }
    }
    const prevBottom = this.y + this.h;
    this.y += this.vy * dt;
    this.onGround = false; this.standSolid = false;
    for (const s of solids) {
      if (overlap(this, s)) {
        if (this.vy > 0) { this.y = s.y - this.h; this.onGround = true; this.standSolid = true; }
        else if (this.vy < 0) this.y = s.y + s.h;
        this.vy = 0;
      }
    }
    if (this.vy >= 0) {
      for (const p of G.level.oneways) {
        if (this.x + this.w > p.x + 2 && this.x < p.x + p.w - 2 && prevBottom <= p.y + 0.5 && this.y + this.h >= p.y) {
          this.y = p.y - this.h; this.vy = 0; this.onGround = true;
        }
      }
    }
  }

  hurt(dmg, dir, kbx = 320, kby = 380) {
    if (this.inv > 0 || this.dead) return false;
    this.hp -= dmg; this.inv = 1.0;
    this.vx = dir * kbx; this.vy = -kby; this.jumping = false; this.onGround = false; this.lock = 0.25;
    Sfx.hurt(); G.shake(5 + dmg * 0.25); G.flashScreen('R', 0.1);
    burst(this.cx, this.y + 20, 10, '#ffffff', 220, 0.4, 3);
    floatText(this.cx, this.y - 6, '-' + dmg, '#ff6a5a', 16);
    if (this.hp <= 0) { this.hp = 0; this.dead = true; this.deadT = 0; Sfx.die(); }
    return true;
  }

  draw() {
    if (this.inv > 0 && !this.dead && Math.floor(this.inv * 18) % 2 === 0) return;
    const X = bxW(this.cx), Y = byW(this.y + this.h) - 1, f = this.face;
    if (this.dead && this.deadT > 0.2) { blit(BM.pDead, X, Y, f); return; }
    const run = this.onGround && Math.abs(this.vx) > 30, air = !this.onGround && !this.dead;
    const fA = Math.floor(this.anim / (Math.PI / 2)) & 1;
    blit(air ? BM.pJump : run ? (fA ? BM.pRunA : BM.pRunB) : BM.pStand, X, Y, f);
    let arm;
    if (this.knifeT > 0 && !this.dead) {
      const k = 1 - this.knifeT / 0.22;
      arm = k < 0.3 ? ARM.knifeUp : ARM.knifeFwd;
      if (k > 0.15 && k < 0.8) arm = arm.concat(ARM.swoosh);
    } else if (this.aimT > 0 && !this.dead) arm = this.muzzle > 0 ? ARM.aim.concat(ARM.flash) : ARM.aim;
    else arm = run && fA ? ARM.swing : ARM.idle;
    const top = Y - 15;
    for (const [dx, r, col] of arm) fr(X + dx * f, top + r, 1, 1, col);
    if (this.stun > 0 && !this.dead) stars(X, top - 3, this.t, 4);
  }
}

// =========================================================
//  DINOSSAUROS - classe base
// =========================================================
class Dino {
  constructor(o) {
    Object.assign(this, {
      name: '', x: 0, y: GROUND_Y, w: 80, h: 60, vx: 0, vy: 0, kvx: 0, face: -1, hp: 100,
      flash: 0, state: 'idle', t: 0, anim: 0, walkPh: 0, stride: 20, dead: false, deathT: 0, keyDropped: false,
      active: false, warn: 0, kbScale: 1, contactDmg: 8, onGround: true, stun: 0, half: 0, collapse: false,
      hitWall: 0, tip: ''
    }, o);
    this.maxHp = this.hp;
    if (!this.half) this.half = this.w / 2;
  }
  body() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  // Caixa à frente/atrás do corpo, considerando a direção para onde olha
  front(off, w, top, h) { return { x: this.face > 0 ? this.x + off : this.x - off - w, y: this.y - top, w, h }; }
  back(off, w, top, h) { return { x: this.face > 0 ? this.x - off - w : this.x + off, y: this.y - top, w, h }; }
  set(s) { this.state = s; this.t = 0; }
  col(cl) { return this.flash > 0 ? '#ffffff' : cl; }
  facePlayer(p) { this.face = p.cx < this.x ? -1 : 1; }
  headPos() { return [this.x + this.face * this.w * 0.4, this.y - this.h]; }
  hurtboxes() { return [Object.assign(this.body(), { mult: 1 })]; }
  attackBoxes() { return []; }
  contactBoxes() { return [this.body()]; }
  idle() { this.vx = 0; }
  onHurt() {}
  onLand(v) { if (v > 300) dust(this.x, GROUND_Y, 8); }

  update(dt) {
    this.anim += dt; this.t += dt;
    this.flash = Math.max(0, this.flash - dt); this.warn = Math.max(0, this.warn - dt);
    if (this.dead) {
      this.deathT += dt; this.x += this.kvx * dt; this.kvx *= Math.pow(0.05, dt);
      this.gravity(dt); this.clampArena();
      if (this.deathT > 1.3 && !this.keyDropped) {
        this.keyDropped = true; G.dropKey(this.x, this.y - Math.min(this.h, 120) * 0.6);
      }
      return;
    }
    if (this.active) this.think(dt, G.player); else this.idle(dt);
    this.x += (this.vx + this.kvx) * dt;
    this.kvx *= Math.pow(0.003, dt);
    this.walkPh += dt * Math.abs(this.vx) / this.stride;
    this.gravity(dt);
    this.clampArena();
  }
  gravity(dt) {
    if (this.y < GROUND_Y || this.vy < 0) {
      this.vy += GRAV * dt; this.y += this.vy * dt; this.onGround = false;
      if (this.y >= GROUND_Y) { const v = this.vy; this.y = GROUND_Y; this.vy = 0; this.onGround = true; this.onLand(v); }
    }
  }
  clampArena() {
    const a = G.arena; this.hitWall = 0;
    if (this.x - this.half < a.x0) { this.x = a.x0 + this.half; this.hitWall = -1; }
    else if (this.x + this.half > a.x1) { this.x = a.x1 - this.half; this.hitWall = 1; }
  }
  takeHit(dmg, dir, kb, kind) {
    if (this.dead || !this.active) return false;
    dmg = Math.max(1, Math.round(dmg));
    this.hp -= dmg; this.flash = 0.1; this.kvx += dir * kb * this.kbScale;
    floatText(this.x + rand(-24, 24), this.y - Math.min(this.h, 170) - 8, '-' + dmg,
      kind === 'knife' ? '#ffe066' : '#ffffff', kind === 'knife' ? 19 : 14);
    if (this.hp <= 0) { this.hp = 0; this.die(dir); } else this.onHurt(dmg, dir, kind);
    return true;
  }
  die(dir) {
    this.dead = true; this.deathT = 0; this.vx = 0; this.kvx = dir * 160 * this.kbScale; this.warn = 0; this.stun = 0;
    Sfx.dinoDie(); G.shake(12); G.flashScreen('W', 0.2); G.hitStop = 0.18; dust(this.x, GROUND_Y, 24); G.onBossDefeated(this);
  }
  // Morte padrão: vira de barriga para cima (vs vai de 1 a -1); os gigantes desabam pela própria geometria
  draw() {
    const k = this.dead && !this.collapse ? easeOut(Math.min(1, this.deathT / 0.8)) : 0;
    Pen.at(this.x, this.y, this.face, { vs: 1 - 2 * k, pv: -this.h * 0.5, flash: this.flash > 0 });
    this.drawBody();
    if (this.warn > 0 && !this.dead) this.drawWarn();
    if (this.stun > 0 && !this.dead) { const hp = this.headPos(); stars(bxW(hp[0]), byW(hp[1] - 22), this.anim, 4); }
  }
  drawWarn() {
    if (tog(this.anim, 10)) return; // pisca
    const [hx, hy] = this.headPos();
    const x = bxW(hx), y = byW(Math.max(74, hy - 36));
    fr(x - 2, y - 4, 5, 9, 'R'); fr(x, y - 3, 1, 4, 'W'); fr(x, y + 2, 1, 1, 'W');
  }
}

// =========================================================
//  FASE 1 - VELOCIRAPTOR: rápido, persegue, dá botes e garradas
// =========================================================
class Raptor extends Dino {
  constructor(x) {
    super({ name: 'Velociraptor', x, w: 70, h: 48, hp: 100, kbScale: 1, contactDmg: 6, face: -1, stride: 16,
      tip: 'Quando ele se agachar, prepare-se: o bote vem em seguida!' });
    this.pcd = 1.2; this.speed = 245;
  }
  headPos() { return [this.x + this.face * 36, this.y - 46]; }
  idle(dt) { this.vx = Math.sin(this.anim * 0.9) * 40; if (Math.abs(this.vx) > 5) this.face = sign(this.vx); }
  think(dt, p) {
    const dx = p.cx - this.x, dist = Math.abs(dx);
    const level = Math.abs((p.y + p.h) - this.y) < 70;
    switch (this.state) {
      case 'idle': this.set('chase'); break;
      case 'chase':
        this.facePlayer(p);
        this.vx = approach(this.vx, dist > 55 ? this.face * this.speed : 0, 1400 * dt);
        this.pcd -= dt;
        if (dist < 85 && level && this.t > 0.25) { this.set('slashW'); this.warn = 0.36; this.vx = 0; }
        else if (this.pcd <= 0 && ((dist > 140 && dist < 420) || (!level && dist < 160))) { this.set('crouch'); this.warn = 0.5; this.vx = 0; }
        break;
      case 'crouch':
        this.vx = 0; this.facePlayer(p);
        if (this.t > 0.5) {
          const dh = Math.max(0, this.y - (p.y + p.h));
          const vy0 = Math.max(620, Math.sqrt(2 * GRAV * (dh + 50)));
          const T = 2 * vy0 / GRAV;
          this.vy = -vy0; this.y -= 1; this.onGround = false;
          this.vx = clamp((p.cx + p.vx * 0.2 - this.x) / T, -600, 600);
          this.set('pounce'); Sfx.tone(520, 0.15, 'square', 0.1, 950);
        }
        break;
      case 'pounce':
        if (this.onGround && this.t > 0.08) { this.vx = 0; this.set('recover'); this.pcd = rand(1.3, 2.3); dust(this.x, GROUND_Y, 6); }
        break;
      case 'slashW': this.vx = 0; if (this.t > 0.36) { this.set('slash'); Sfx.slash(); } break;
      case 'slash': this.vx = this.face * 140; if (this.t > 0.16) this.set('recover'); break;

      case 'sweepRec': if (this.t > 0.35) { this.drop = 1; this.dazeT = 0.9; this.set('dazed'); } break;
      case 'shakeW':
        this.vx = 0;
        if (this.t > 0.9) {
          const n = angry ? 8 : 5, a0 = G.arena.x0 + 40, a1 = G.arena.x1 - 40;
          for (let i = 0; i < n; i++) G.spawnDebris(rand(a0, a1), 1.0 + i * 0.12);
          G.spawnDebris(clamp(p.cx, a0, a1), 1.1);
          G.shake(6); Sfx.thud(); this.set('rest');
        }
        break;
      case 'rest':
        if (this.t > 0.8) { this.set('walk'); this.atkCd = angry ? rand(1.2, 2.0) : rand(2.0, 3.0); }
        break;
    }
  }
  drawBody() {
    const P = Pen, g = this.geo(), a = this.anim, s = this.state, tg = tog(a, 4);
    const ph = qph(this.walkPh), moving = Math.abs(this.vx) > 4 && this.onGround;
    const foot = (bx, off, lift) => [bx + (moving ? Math.sin(ph + off) * 14 : 0), -(moving ? Math.max(0, Math.cos(ph + off)) * 8 : 0) - lift];
    const lift = this.rear * 60;
    const drawLeg = (hip, ft, len, col) => {
      P.leg(hip[0], hip[1], ft[0], ft[1], len, 1, 40, 34, col);
      P.ell(ft[0] + 2, ft[1] - 5, 22, 8, col);
    };
    const tb = g.tailBase;
    P.curve(tb[0], tb[1], -215, -175 + g.sink, -285, -105 + tog(a, 1.4) * 10 + g.sink, 52, 8, 'G');
    drawLeg(g.P(-66, -160), foot(-62, Math.PI, 0), 164, 'E');
    drawLeg(g.P(90, -185), foot(92, 0, lift), 188, 'E');
    P.ell(g.body[0], g.body[1], 130, 62, 'G');
    P.ell(g.body[0] + 4, g.body[1] + 34, 78, 14, 'S');
    for (let i = 0; i < 7; i++) {
      const q = g.P(-90 + i * 30, -225 + (i % 2) * 14);
      P.dot(q[0], q[1], 14, 9, 'E');
    }
    const sh = g.shoulder, hd = g.head;
    const mx = (sh[0] + hd[0]) / 2 - 28, my = (sh[1] + hd[1]) / 2 - 22;
    P.curve(sh[0] - 10, sh[1] + 10, mx, my, hd[0] - 10, hd[1] + 4, 52, 22, 'G');
    P.spr(BM.brachioHead, hd[0], hd[1]);
    if (!this.dead && (s === 'dazed' || this.drop > 0.5) && tg) P.ring(hd[0] + 4, hd[1], 40, 28, 'Y');
    drawLeg(g.P(-96, -160), foot(-92, 0, 0), 164, 'G');
    drawLeg(g.P(62, -185), foot(64, Math.PI, lift), 188, 'G');
  }
}

// =========================================================
//  FASE 5 - TIRANOSSAURO REX: chefe final; rugido atordoa, investida, mordida.
//  Com 50% de vida entra na fase 2: mais rápido, golpe de cauda e pisão com detritos.
// =========================================================
class TRex extends Dino {
  constructor(x) {
    super({ name: 'Tiranossauro Rex', x, w: 150, h: 150, hp: 520, kbScale: 0.15, contactDmg: 12, face: -1, half: 85, stride: 24,
      collapse: true, tip: 'Pule ou afaste-se para escapar do rugido. A cabeça é o ponto fraco!' });
    this.phase2 = false; this.roarCd = 4; this.stompCd = 3; this.atkCd = 1.2; this.turnT = 0;
    this.chargeDir = 1; this.passed = false; this.done = false;
  }
  get spd() { return this.phase2 ? 1.35 : 1; }
  tw(t) { return this.phase2 ? t * 0.72 : t; }
  pose() {
    const s = this.state, t = this.t;
    let hx = 98, hy = -128, jaw = 0.08 + Math.sin(this.anim * 2) * 0.03, lean = 0;
    if (s === 'biteW') { const k = Math.min(1, t / this.tw(0.55)); hx -= 18 * k; hy -= 8 * k; jaw = 0.1 + 0.6 * k; }
    else if (s === 'bite') { const k = Math.min(1, t / 0.08); hx = 80 + 60 * k; hy = -136 + 66 * k; jaw = 0.7 * (1 - k); lean = 0.15 * k; }
    else if (s === 'roarW') { const k = Math.min(1, t / this.tw(0.9)); hx -= 14 * k; hy -= 26 * k; jaw = 0.2 + 0.3 * k; lean = -0.12 * k; }
    else if (s === 'roar' || s === 'enrage') { hx -= 6; hy -= 20; jaw = 0.85 + Math.sin(this.anim * 40) * 0.05; lean = -0.06; }
    else if (s === 'chargeW' || s === 'charge' || s === 'skid') { const k = s === 'chargeW' ? Math.min(1, t / 0.3) : 1; hx += 12 * k; hy += 26 * k; lean = 0.12 * k; jaw = s === 'charge' ? 0.45 : 0.15; }
    else if (s === 'recover' && this.stun > 0) { hy += 14; jaw = 0.3; lean = 0.08; }
    return { hx, hy, jaw, lean };
  }
  headPos() { const p = this.pose(); return [this.x + this.face * (p.hx + 10), this.y + p.hy]; }
  hurtboxes() {
    const p = this.pose(), f = this.face;
    return [
      { x: this.x + f * (p.hx + 14) - 42, y: this.y + p.hy - 26, w: 84, h: 52, mult: 1.5 },
      { x: this.x - 80, y: this.y - 140, w: 160, h: 80, mult: 1 },
      { x: this.x - 42, y: this.y - 62, w: 84, h: 62, mult: 1 }
    ];
  }
  contactBoxes() { return ['enrage', 'charge', 'skid'].includes(this.state) ? [] : [{ x: this.face > 0 ? this.x - 60 : this.x - 120, y: this.y - 130, w: 180, h: 130 }]; }
  attackBoxes() {
    const s = this.state;
    if (s === 'bite' && this.t < 0.16) return [Object.assign(this.front(70, 120, 150, 150), { dmg: 24, kb: 420, kby: 380 })];
    if (s === 'charge' && Math.abs(this.vx) > 250) return [Object.assign(this.front(20, 100, 110, 110), { dmg: 28, kb: 600, kby: 450 })];
    if (s === 'tail' && this.t < 0.25) return [Object.assign(this.back(40, 210, 100, 100), { dmg: 20, kb: 520, kby: 420 })];
    return [];
  }
  onHurt() {
    if (!this.phase2 && this.hp <= this.maxHp / 2) {
      this.phase2 = true; this.set('enrage'); this.vx = 0; this.warn = 0; this.stun = 0;
      G.banner('FASE 2: FÚRIA!', '#ff6a3a'); Sfx.roar(true); G.shake(12);
    }
  }
  roarNow(p) {
    Sfx.roar(true); G.shake(10); G.flashScreen('Y', 0.1);
    const [hx, hy] = this.headPos();
    for (let i = 0; i < 3; i++) G.rings.push({ x: hx, y: hy, r: 20 + i * 30, life: 0.9 });
    if (this.state === 'roar' && !p.dead && p.onGround && Math.abs(p.cx - this.x) < 480) {
      p.stun = this.phase2 ? 1.0 : 1.2; p.vx = 0;
      floatText(p.cx, p.y - 20, 'ATORDOADO!', '#ffe066', 16);
    }
  }
  think(dt, p) {
    const dx = p.cx - this.x, dist = Math.abs(dx), behind = sign(dx) !== this.face;
    this.roarCd -= dt; this.stompCd -= dt;
    this.stun = Math.max(0, this.stun - dt);
    switch (this.state) {
      case 'idle': this.set('stalk'); break;
      case 'stalk':
        this.turnT = behind ? this.turnT + dt : 0;
        if (this.turnT > (this.phase2 ? 0.75 : 0.45) && !(this.phase2 && dist < 230)) { this.face = -this.face; this.turnT = 0; }
        if (this.phase2 && behind && this.turnT > 1.4) { this.face = -this.face; this.turnT = 0; }
        this.vx = approach(this.vx, (!behind && dist > 170) ? this.face * 110 * this.spd : 0, 600 * dt);
        this.atkCd -= dt;
        if (this.atkCd <= 0) {
          if (this.roarCd <= 0 && !behind) { this.set('roarW'); this.warn = this.tw(0.9); this.roarCd = this.phase2 ? 7 : 9; }
          else if (this.phase2 && behind && dist < 240) { this.set('tailW'); this.warn = this.tw(0.6); }
          else if (this.phase2 && this.stompCd <= 0) { this.set('stompW'); this.warn = this.tw(0.7); this.stompCd = 7; }
          else if (!behind && dist < 210) { this.set('biteW'); this.warn = this.tw(0.55); }
          else if (!behind && dist > 300) { this.set('chargeW'); this.warn = this.tw(0.8); }
          if (this.state !== 'stalk') this.vx = 0;
        }
        break;
      case 'biteW': this.vx = 0; if (this.t > this.tw(0.55)) { this.set('bite'); Sfx.slash(); } break;
      case 'bite': this.vx = this.face * 60; if (this.t > 0.22) { this.set('recover'); } break;
      case 'chargeW':
        this.vx = 0; this.facePlayer(p);
        if (Math.random() < 0.4) dust(this.x - this.face * 30, GROUND_Y, 1);
        if (this.t > this.tw(0.8)) { this.chargeDir = this.face; this.passed = false; this.set('charge'); Sfx.roar(false); }
        break;
      case 'charge':
        this.face = this.chargeDir;
        this.vx = approach(this.vx, this.chargeDir * 470 * this.spd, 2200 * dt);
        if (Math.random() < 0.6) dust(this.x - this.face * 40, GROUND_Y, 1);
        if ((p.cx - this.x) * this.chargeDir < -160) this.passed = true;
        if (this.hitWall === this.chargeDir) {
          this.vx = 0; this.kvx = -this.chargeDir * 120; G.shake(12); Sfx.crash();
          this.stun = this.phase2 ? 0.8 : 1.2; this.recT = this.stun; this.set('recover');
          floatText(this.x, this.y - 170, 'Tonto!', '#ffe066', 16);
        } else if (this.passed || this.t > 2.6) this.set('skid');
        break;
      case 'skid':
        this.vx = approach(this.vx, 0, 1300 * dt);
        if (Math.random() < 0.6) dust(this.x + this.face * 30, GROUND_Y, 1);
        if (this.vx === 0) this.set('recover');
        break;
      case 'roarW': this.vx = 0; if (this.t > this.tw(0.9)) { this.set('roar'); this.roarNow(p); } break;
      case 'roar': this.vx = 0; if (this.t > 1.0) { this.set('stalk'); this.atkCd = 0.4; } break;
      case 'enrage':
        this.vx = 0;
        if (!this.done && this.t > 0.2) { this.done = true; this.roarNow(p); }
        if (this.t > 1.6) { this.set('stalk'); this.atkCd = 0.5; }
        break;
      case 'tailW': this.vx = 0; if (this.t > this.tw(0.6)) { this.set('tail'); Sfx.slash(); } break;
      case 'tail': if (this.t > 0.35) this.set('recover'); break;
      case 'stompW': this.vx = 0; if (this.t > this.tw(0.7)) { this.set('stomp'); this.stompNow(p); } break;
      case 'stomp': if (this.t > 0.4) this.set('recover'); break;
      case 'recover':
        this.vx = approach(this.vx, 0, 900 * dt);
        if (this.t > Math.max(this.recT || 0, this.phase2 ? 0.35 : 0.55)) { this.stun = 0; this.recT = 0; this.set('stalk'); this.atkCd = (dist < 230 ? rand(0.2, 0.4) : rand(0.5, 1.1)) / this.spd; }
        break;
    }
  }
  stompNow(p) {
    G.shake(14); Sfx.stomp();
    const fx = this.x + this.face * 20;
    dust(fx, GROUND_Y, 20, '#8a6a5a', 2);
    G.spawnWave(fx, 1, 430, 12); G.spawnWave(fx, -1, 430, 12);
    const a0 = G.arena.x0 + 40, a1 = G.arena.x1 - 40;
    for (let i = 0; i < 5; i++) G.spawnDebris(rand(a0, a1), 0.9 + i * 0.12);
    G.spawnDebris(clamp(p.cx, a0, a1), 1.0);
  }
  drawBody() {
    const P = Pen, Q = this.pose(), a = this.anim, s = this.state, tg = tog(a, 4);
    if (this.phase2) P.map = { N: 'O', n: 'R', S: 'Y', Y: 'R' };
    if (this.dead) P.map = Object.assign({}, P.map, { Y: 'K' });
    const sink = this.dead ? easeOut(Math.min(1, this.deathT / 1.0)) * 55 : 0;
    if (sink) { Q.hy += sink + 30 * (sink / 55); Q.jaw = 0.25; }
    const ph = qph(this.walkPh), moving = Math.abs(this.vx) > 10 && this.onGround;
    const bob = moving ? -Math.abs(Math.sin(ph)) * 4 : 0;
    const by = -100 + bob + sink;
    let sway = tg * 8;
    if (s === 'tailW') sway -= 24 * Math.min(1, this.t / 0.3);
    if (s === 'tail') sway += Math.sin(Math.min(1, this.t / 0.3) * Math.PI) * 50 - 24;
    P.curve(-50, by - 6, -130, by - 12 + sway * 0.3, -210, by + 16 + sway, 48, 6, 'N');
    if (s === 'tailW' && !this.dead && tg) P.ring(-190, by + 10 + sway, 24, 22, 'R');
    let f1x, f1y, f2x, f2y;
    if (moving) {
      f1x = Math.sin(ph) * 26; f1y = -Math.max(0, -Math.cos(ph)) * 12;
      f2x = -Math.sin(ph) * 26; f2y = -Math.max(0, Math.cos(ph)) * 12;
    } else { f1x = 10; f1y = 0; f2x = -14; f2y = 0; }
    if (s === 'stompW') { const k = Math.min(1, this.t / this.tw(0.5)); f1x = 22; f1y = -44 * k; }
    const foot = (fx, fy, col) => { P.seg(fx - 6, fy - 8, fx + 18, fy, 7, 7, col); P.dot(fx + 20, fy - 1, 6, 3, 'W'); };
    P.leg(-8, by + 10, f2x - 6, f2y - 10, 104, -1, 24, 16, 'n'); foot(f2x, f2y, 'n');
    P.ell(0, by, 80, 43, 'N');
    P.ell(14, by + 18, 58, 17, 'S');
    for (let i = 0; i < 5; i++) P.seg(-50 + i * 20, by - 36 + Math.abs(i - 2) * 3, -56 + i * 20, by - 18, 6, 6, 'n');
    P.curve(48, by - 14, 78, by - 34, Q.hx - 8, Q.hy + 6, 50, 40, 'N');
    P.spr(Q.jaw > 0.35 ? BM.rexHeadOpen : BM.rexHead, Q.hx, Q.hy);
    const ex = 62 + tg * 2, ey = by + 20;
    P.seg(52, by + 6, ex, ey, 6, 6, 'n'); P.seg(ex, ey, ex + 10, ey - 3, 5, 5, 'n');
    P.ell(-4, by + 12, 30, 38, 'N');
    P.leg(-2, by + 18, f1x - 6, f1y - 10, 98, -1, 24, 16, 'N'); foot(f1x, f1y, 'N');
  }
}

function makeBoss(type, x) {
  switch (type) {
    case 'raptor': return new Raptor(x);
    case 'anky': return new Anky(x);
    case 'pachy': return new Pachy(x);
    case 'brachio': return new Brachio(x);
    default: return new TRex(x);
  }
}

class Level {
