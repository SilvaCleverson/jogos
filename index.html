<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos</title>
<style>
  :root { --bg: #0b0f0a; --card: #151b13; --line: #2a3526; --txt: #e8f0e0; --mut: #9fae98; --acc: #ffd860; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #16201280, var(--bg) 60%), var(--bg);
    color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { text-align: center; padding: 56px 16px 24px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); color: var(--acc); letter-spacing: .04em; }
  header p { margin: 8px 0 0; color: var(--mut); }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 22px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none;
    transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--acc);
    box-shadow: 0 8px 24px rgba(0,0,0,.5); outline: none; }
  .card h2 { margin: 0; font-size: 1.4rem; color: var(--acc); }
  .card p { margin: 0; line-height: 1.5; }
  .card .by { color: var(--mut); font-size: .9rem; }
  .card .play { margin-top: auto; padding-top: 8px; font-weight: 700; color: #7dff8a; }
  footer { text-align: center; color: var(--mut); font-size: .85rem; padding: 32px 16px; }
</style>
</head>
<body>
<header>
  <h1>Jogos</h1>
  <p>Escolha um jogo e divirta-se.</p>
</header>
<main>
  <div class="grid">
    <!-- Para adicionar um jogo, copie um bloco <a class="card"> abaixo e ajuste href, título, descrição e autor. -->
    <a class="card" href="fuga-jurassica/">
      <h2>Fuga Jurássica</h2>
      <p>Ação 2D: enfrente 5 dinossauros com arma e faca, conquiste as chaves e derrote o T-rex.</p>
      <span class="by">por Nickolas Reis</span>
      <span class="play">Jogar &rarr;</span>
    </a>
  </div>
</main>
<footer>Jogos criados por Nickolas Reis</footer>
</body>
</html>
