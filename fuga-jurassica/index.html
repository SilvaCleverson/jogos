  drawBg(c, camX, t) {
    const th = this.th;
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (th.sun) {
      const sx = W * 0.78 - camX * 0.02;
      c.fillStyle = 'rgba(255,255,230,0.25)'; c.beginPath(); c.arc(sx, 92, 62, 0, Math.PI * 2); c.fill();
      c.fillStyle = th.sun; c.beginPath(); c.arc(sx, 92, 38, 0, Math.PI * 2); c.fill();
    }
    if (th.volcano) {
      const vx = 620 - camX * 0.05;
      c.fillStyle = '#2c1520'; c.beginPath(); c.moveTo(vx - 330, GROUND_Y); c.lineTo(vx - 70, 150); c.lineTo(vx + 70, 150); c.lineTo(vx + 330, GROUND_Y); c.closePath(); c.fill();
      const lg = c.createRadialGradient(vx, 150, 5, vx, 150, 120);
      lg.addColorStop(0, 'rgba(255,140,40,0.9)'); lg.addColorStop(1, 'rgba(255,80,20,0)');
      c.fillStyle = lg; c.fillRect(vx - 130, 30, 260, 240);
      c.strokeStyle = '#ff7a2a'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(vx - 20, 152); c.quadraticCurveTo(vx - 40, 230, vx - 90, 300); c.stroke();
      for (let i = 0; i < 6; i++) {
        const k = ((t * 0.15 + i / 6) % 1);
        c.fillStyle = 'rgba(60,40,50,' + (0.5 * (1 - k)) + ')';
        c.beginPath(); c.arc(vx + Math.sin(i * 2 + t * 0.5) * 30 * k, 140 - k * 150, 20 + k * 40, 0, Math.PI * 2); c.fill();
      }
    }
    // Montanhas distantes
    c.fillStyle = th.far; c.beginPath(); c.moveTo(-10, H);
    for (const [x, y] of this.far) {
      const sx = x - camX * 0.15;
      if (sx < -150 || sx > W + 150) continue;
      if (th.tree === 'mesa') { c.lineTo(sx, y + 40); c.lineTo(sx + 6, y); c.lineTo(sx + 44, y); c.lineTo(sx + 50, y + 40); }
      else c.lineTo(sx, y);
    }
    c.lineTo(W + 10, H); c.closePath(); c.fill();
    // Árvores intermediárias
    c.fillStyle = th.mid; c.strokeStyle = th.mid;
    for (const [x, s, r] of this.trees) {
      const sx = x - camX * 0.4;
      if (sx < -150 || sx > W + 150) continue;
      this.drawTree(c, sx, GROUND_Y - 30, s, r, t, th.tree, th.mid);
    }
    c.fillStyle = th.mid; c.fillRect(0, GROUND_Y - 34, W, H);
    if (th.fog) { c.fillStyle = th.fog; c.fillRect(0, 0, W, H); }
  }
  drawTree(c, x, base, s, r, t, type, col) {
    c.fillStyle = col; c.strokeStyle = col; c.lineCap = 'round';
    if (type === 'palm') {
      const tx = x + 22 * s, ty = base - 150 * s;
      c.lineWidth = 9 * s; c.beginPath(); c.moveTo(x, base); c.quadraticCurveTo(x - 6 * s, base - 80 * s, tx, ty); c.stroke();
      c.lineWidth = 5 * s;
      for (let i = 0; i < 7; i++) {
        const a = -Math.PI + i * (Math.PI / 6) + Math.sin(t + r * 6) * 0.05;
        c.beginPath(); c.moveTo(tx, ty); c.quadraticCurveTo(tx + Math.cos(a) * 40 * s, ty + Math.sin(a) * 30 * s - 10 * s, tx + Math.cos(a) * 62 * s, ty + 18 * s); c.stroke();
      }
    } else if (type === 'cypress') {
      c.fillRect(x - 5 * s, base - 120 * s, 10 * s, 120 * s);
      for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(x + (i % 2 ? 18 : -18) * s, base - (110 + i * 25) * s, 30 * s, 0, Math.PI * 2); c.fill(); }
      c.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(x - 30 * s + i * 14 * s, base - 100 * s); c.lineTo(x - 30 * s + i * 14 * s, base - (60 + r * 30) * s); c.stroke(); }
    } else if (type === 'conifer') {
      c.fillRect(x - 5 * s, base - 40 * s, 10 * s, 40 * s);
      for (let i = 0; i < 4; i++) {
        const w = (60 - i * 12) * s, y = base - (30 + i * 45) * s;
        c.beginPath(); c.moveTo(x - w, y); c.lineTo(x, y - 80 * s); c.lineTo(x + w, y); c.closePath(); c.fill();
      }
    } else if (type === 'mesa') {
      const w = (40 + r * 50) * s, h = (60 + r * 120) * s;
      c.beginPath(); c.moveTo(x - w, base); c.lineTo(x - w * 0.8, base - h); c.lineTo(x + w * 0.8, base - h); c.lineTo(x + w, base); c.closePath(); c.fill();
    } else {
      c.lineWidth = 7 * s; c.beginPath(); c.moveTo(x, base); c.lineTo(x + 6 * s, base - 130 * s); c.stroke();
      c.lineWidth = 3.5 * s;
      for (let i = 0; i < 4; i++) {
        const y = base - (60 + i * 18) * s, d = i % 2 ? 1 : -1;
        c.beginPath(); c.moveTo(x + 3 * s, y); c.lineTo(x + d * (30 - i * 4) * s, y - 26 * s); c.stroke();
      }
    }
  }

  // ---------- Terreno (coordenadas do mundo) ----------
  drawTerrain(c, camX, t, treeShake) {
    const th = this.th, x0 = camX - 40, x1 = camX + W + 40;
    if (th.pit === 'lava') {
      const lg = c.createLinearGradient(0, H - 60, 0, H);
      lg.addColorStop(0, '#ffb43a'); lg.addColorStop(1, '#c2300f');
      c.fillStyle = lg; c.beginPath(); c.moveTo(x0, H);
      for (let x = x0; x <= x1; x += 20) c.lineTo(x, H - 44 + Math.sin(x * 0.03 + t * 2) * 4);
      c.lineTo(x1, H); c.closePath(); c.fill();
    } else if (th.pit === 'water') {
      c.fillStyle = '#2e4a3c'; c.beginPath(); c.moveTo(x0, H);
      for (let x = x0; x <= x1; x += 20) c.lineTo(x, H - 50 + Math.sin(x * 0.04 + t * 1.5) * 3);
      c.lineTo(x1, H); c.closePath(); c.fill();
    } else {
      c.fillStyle = 'rgba(10,8,6,0.55)'; c.fillRect(x0, GROUND_Y + 20, x1 - x0, H);
    }
    // Árvores grandes da arena (sacodem com o braquiossauro)
    for (const ax of [this.AX + 70, this.AX + 890]) {
      if (ax < x0 - 200 || ax > x1 + 200) continue;
      const sh = treeShake > 0 ? Math.sin(t * 40) * 6 * Math.min(1, treeShake) : 0;
      c.fillStyle = '#4a3420'; c.fillRect(ax - 14, GROUND_Y - 260, 28, 260);
      c.fillStyle = th.fern;
      for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(ax + sh + Math.cos(i * 1.3) * 60, GROUND_Y - 280 + Math.sin(i * 1.9) * 26, 52, 0, Math.PI * 2); c.fill(); }
    }
    for (const g of this.ground) {
      if (g.x > x1 || g.x + g.w < x0) continue;
      const gx = Math.max(g.x, x0), gw = Math.min(g.x + g.w, x1) - gx;
      c.fillStyle = th.dirt; c.fillRect(gx, g.y, gw, H - g.y + 20);
      c.fillStyle = th.dirt2; c.fillRect(gx, g.y + 34, gw, H);
      c.fillStyle = th.grass; c.fillRect(gx, g.y - 3, gw, 9);
      c.fillStyle = 'rgba(0,0,0,0.25)';
      if (g.x >= x0) c.fillRect(g.x, g.y, 4, H);
      if (g.x + g.w <= x1) c.fillRect(g.x + g.w - 4, g.y, 4, H);
      c.fillStyle = th.grass;
      for (let x = Math.floor(gx / 9) * 9; x < gx + gw; x += 9) { c.beginPath(); c.moveTo(x, g.y - 2); c.lineTo(x + 3, g.y - 8 - ((x * 7) % 5)); c.lineTo(x + 6, g.y - 2); c.fill(); }
    }
    c.fillStyle = 'rgba(0,0,0,0.18)';
    for (const [sx, sy, sz] of this.specks) if (sx > x0 && sx < x1 && this.onGroundAt(sx)) c.fillRect(sx, sy, sz * 2, sz);
    c.strokeStyle = th.fern; c.lineWidth = 2;
    for (const [fx, r] of this.ferns) {
      if (fx < x0 || fx > x1) continue;
      for (let k = -2; k <= 2; k++) {
        c.beginPath(); c.moveTo(fx, GROUND_Y);
        c.quadraticCurveTo(fx + k * 6, GROUND_Y - 14 - r * 8, fx + k * 12 + Math.sin(t * 2 + fx) * 1.5, GROUND_Y - 6 - r * 6); c.stroke();
      }
    }
    for (const b of this.blocks) {
      if (b.x > x1 || b.x + b.w < x0) continue;
      c.fillStyle = th.rock; roundRect(c, b.x, b.y, b.w, b.h + 6, 8); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.15)'; c.fillRect(b.x + 6, b.y + 4, b.w - 12, 5);
      c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(b.x + b.w * 0.3, b.y + 12); c.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.6); c.lineTo(b.x + b.w * 0.35, b.y + b.h); c.stroke();
    }
    for (const p of this.oneways) {
      if (p.x > x1 || p.x + p.w < x0) continue;
      c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(p.x + 10, p.y + 12, 6, 14); c.fillRect(p.x + p.w - 16, p.y + 12, 6, 14);
      c.fillStyle = th.plank; roundRect(c, p.x, p.y, p.w, 14, 4); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(p.x + 3, p.y + 2, p.w - 6, 3);
      c.fillStyle = 'rgba(0,0,0,0.3)';
      for (let x = p.x + 24; x < p.x + p.w - 8; x += 26) c.fillRect(x, p.y + 2, 2, 10);
      c.fillStyle = th.fern; c.fillRect(p.x + 4, p.y + 12, 3, 8 + (p.x % 7)); c.fillRect(p.x + p.w * 0.6, p.y + 12, 3, 12);
    }
    for (const s of this.spikes) {
      if (s.x > x1 || s.x + s.w < x0) continue;
      for (let x = s.x; x < s.x + s.w - 4; x += 12) {
        c.fillStyle = '#d8c290'; c.beginPath(); c.moveTo(x, s.y + s.h); c.lineTo(x + 6, s.y - 4); c.lineTo(x + 12, s.y + s.h); c.closePath(); c.fill();
        c.fillStyle = '#8c3a2a'; c.beginPath(); c.moveTo(x + 4, s.y + 3); c.lineTo(x + 6, s.y - 4); c.lineTo(x + 8, s.y + 3); c.closePath(); c.fill();
      }
    }
    for (const v of this.vents) {
      if (v.x > x1 || v.x + v.w < x0) continue;
      const st = this.ventState(v, t), lava = th.pit === 'lava';
      c.fillStyle = '#1c1410'; roundRect(c, v.x, GROUND_Y - 6, v.w, 10, 4); c.fill();
      c.fillStyle = lava ? '#ff7a2a' : '#c9d6d8'; c.fillRect(v.x + 8, GROUND_Y - 4, v.w - 16, 4);
      if (st === 1) {
        for (let i = 0; i < 3; i++) {
          const k = (t * 2 + i / 3) % 1;
          c.fillStyle = lava ? 'rgba(255,150,50,' + (1 - k) + ')' : 'rgba(230,240,240,' + (0.8 - k * 0.8) + ')';
          c.beginPath(); c.arc(v.x + 10 + i * 8, GROUND_Y - 6 - k * 26, 4 + k * 4, 0, Math.PI * 2); c.fill();
        }
      } else if (st === 2) {
        const gr = c.createLinearGradient(0, GROUND_Y - 170, 0, GROUND_Y);
        if (lava) { gr.addColorStop(0, 'rgba(255,200,60,0.2)'); gr.addColorStop(1, 'rgba(255,90,20,0.95)'); }
        else { gr.addColorStop(0, 'rgba(255,255,255,0.1)'); gr.addColorStop(1, 'rgba(240,248,250,0.9)'); }
        c.fillStyle = gr; c.beginPath(); c.moveTo(v.x + 4, GROUND_Y);
        for (let y = GROUND_Y; y > GROUND_Y - 170; y -= 14) c.lineTo(v.x + 2 + Math.sin(y * 0.2 + t * 20) * 5, y);
        for (let y = GROUND_Y - 170; y < GROUND_Y; y += 14) c.lineTo(v.x + v.w - 2 + Math.sin(y * 0.2 + t * 20 + 1) * 5, y);
        c.closePath(); c.fill();
      }
    }
  }
}

// =========================================================
//  JOGO: estados, mundo, colisões
// =========================================================
const BEST_KEY = 'fugaJurassica.melhorTempo';

class Game {
  constructor() {
    this.state = 'title'; this.stateT = 0; this.t = 0; this.touch = false;
    this.best = parseFloat(Store.get(BEST_KEY)) || 0; this.newRecord = false;
    this.player = new Player(); this.totalTime = 0;
    this.titleRex = new TRex(0);
    this.btns = [
      { x: W / 2 - 240, y: 300, w: 230, h: 52, label: 'Tentar a fase de novo', key: 'Enter', act: () => this.retryLevel() },
      { x: W / 2 + 10, y: 300, w: 230, h: 52, label: 'Recomeçar do início', key: 'R', act: () => this.startGame() }
    ];
    this.loadLevel(0);
  }
  loadLevel(i) {
    this.levelIndex = i; this.level = new Level(i);
    const L = this.level;
    this.parts = []; this.texts = []; this.bullets = []; this.waves = []; this.debris = []; this.rings = [];
    this.keyItem = null; this.hasKey = false; this.gateOpen = 0; this.gateOpening = false;
    this.fight = false; this.won = false; this.barrier = 0; this.bossIntro = 0; this.treeShake = 0;
    this.levelT = 0; this.cam = { x: 0 }; this.shakeMag = 0; this.sx = 0; this.sy = 0; this.hitStop = 0;
    this.bannerT = 0; this.bannerText = ''; this.bannerSub = ''; this.bannerCol = '#fff'; this.msgT = {};
    this.arena = { x0: L.AX + 22, x1: L.AX + 918 };
    this.dino = makeBoss(L.d.boss, L.AX + 680);
    this.bossShow = this.dino.hp;
    this.player.reset(80, GROUND_Y - 46);
    this._solids = L.solids;
    this.ammoAtStart = this.player.ammo;
  }
  startGame() { this.totalTime = 0; this.player = new Player(); this.loadLevel(0); this.toCard(); }
  toCard() { this.state = 'card'; this.stateT = 0; }
  retryLevel() {
    const p = this.player; p.hp = p.maxHp; p.ammo = Math.max(this.ammoAtStart, 10);
    this.loadLevel(this.levelIndex); this.toCard();
  }
  nextLevel() {
    if (this.levelIndex >= LEVELS.length - 1) { this.win(); return; }
    const p = this.player; p.hp = Math.min(p.maxHp, p.hp + 40); p.ammo = Math.max(p.ammo, 12);
    this.loadLevel(this.levelIndex + 1); this.toCard();
  }
  win() {
    this.state = 'victory'; this.stateT = 0; Sfx.win();
    this.newRecord = !this.best || this.totalTime < this.best;
    if (this.newRecord) { this.best = this.totalTime; Store.set(BEST_KEY, String(this.totalTime)); }
  }
  pause() { if (this.state === 'play') { this.state = 'paused'; this.stateT = 0; Input.clearAll(); } }
  toTitle() { this.state = 'title'; this.stateT = 0; this.player = new Player(); this.loadLevel(0); }
  shake(m) { this.shakeMag = Math.max(this.shakeMag, Math.min(m, 18)); }
  banner(text, col, sub) { this.bannerText = text; this.bannerCol = col; this.bannerSub = sub || ''; this.bannerT = 3.2; }
  // Mensagem com intervalo mínimo, para não poluir a tela
  hint(key, x, y, text, col, size = 13) {
    if ((this.msgT[key] || 0) > this.t) return;
    this.msgT[key] = this.t + 1.4; floatText(x, y, text, col, size);
  }

  update(dt) {
    this.t += dt; this.stateT += dt;
    if (Input.take('mute')) Sfx.muted = !Sfx.muted;
    switch (this.state) {
      case 'title':
        this.cam.x = (this.t * 40) % (this.level.AX - 200);
        if (Input.take('enter')) { Sfx.init(); this.startGame(); }
        break;
      case 'card':
        this.updateFx(dt);
        if (this.stateT > 2.6 || (this.stateT > 0.4 && Input.take('enter'))) { this.state = 'play'; this.stateT = 0; }
        break;
      case 'play':
        if (Input.take('pause')) { this.pause(); break; }
        this.totalTime += dt; this.levelT += dt;
        this.updateWorld(dt);
        break;
      case 'paused':
        if (Input.take('pause') || Input.take('enter')) this.state = 'play';
        else if (Input.take('restart')) this.startGame();
        break;
      case 'clear':
        this.updateFx(dt);
        if (this.stateT > 1.8) this.nextLevel();
        break;
      case 'gameover':
        this.updateFx(dt);
        if (this.stateT > 0.5) {
          if (Input.take('enter')) this.retryLevel();
          else if (Input.take('restart')) this.startGame();
        }
        break;
      case 'victory':
        this.updateFx(dt);
        if (this.stateT > 1 && Input.take('enter')) this.toTitle();
        break;
    }
  }
  tap(x, y) {
    Sfx.init();
    switch (this.state) {
      case 'title': this.startGame(); break;
      case 'card': if (this.stateT > 0.4) { this.state = 'play'; this.stateT = 0; } break;
      case 'paused': this.state = 'play'; break;
      case 'gameover': if (this.stateT > 0.5) for (const b of this.btns) if (pointIn(x, y, b)) { b.act(); return; } break;
      case 'victory': if (this.stateT > 1) this.toTitle(); break;
    }
  }

  updateWorld(dt) {
    if (this.hitStop > 0) { this.hitStop -= dt; return; }
    const L = this.level, p = this.player;
    this.buildSolids();
    p.update(dt);
    if (!this.fight && !this.won && p.x > L.AX + 70 && !p.dead) this.startFight();
    if (this.fight) this.barrier = Math.min(1, this.barrier + dt * 2.5);
    if (this.bossIntro > 0) { this.bossIntro -= dt; if (this.bossIntro <= 0 && !this.dino.dead) this.dino.active = true; }
    this.treeShake = Math.max(0, this.treeShake - dt);
    this.dino.update(dt);
    this.updateBullets(dt);
    this.dinoVsPlayer();
    this.updateHazards();
    this.updateWaves(dt);
    this.updateDebris(dt);
    this.updateItems(dt);
    this.updateKeyGate(dt);
    if (p.y > H + 60 && !p.dead) this.fellInPit();
    if (p.dead && p.deadT > 1.5) { this.state = 'gameover'; this.stateT = 0; }
    this.updateFx(dt);
  }
  startFight() {
    this.fight = true; this.bossIntro = 1.6;
    this.banner(this.dino.name, '#ffd860', this.dino.tip);
    Sfx.roar(this.levelIndex >= 3); this.shake(6);
    this.dino.facePlayer(this.player);
  }
  buildSolids() {
    const L = this.level, s = L.solids.slice();
    if (this.barrier > 0.3) s.push({ x: L.AX - 4, y: -400, w: 24, h: 400 + GROUND_Y });
    if (this.gateOpen < 1) s.push({ x: L.AX + 920, y: -400, w: 40, h: 400 + GROUND_Y });
    this._solids = s;
  }
  solids() { return this._solids; }
  isSafe(p) {
    const L = this.level, l = p.x - 30, r = p.x + p.w + 30;
    if (!L.onGroundAt(l) || !L.onGroundAt(r)) return false;
    for (const s of L.spikes) if (r > s.x - 40 && l < s.x + s.w + 40) return false;
    for (const v of L.vents) if (r > v.x - 40 && l < v.x + v.w + 40) return false;
    return true;
  }
  fellInPit() {
    const p = this.player;
    p.hp -= 20; Sfx.hurt(); this.shake(6);
    if (p.hp <= 0) { p.hp = 0; p.dead = true; p.deadT = 0; p.vy = 0; Sfx.die(); return; }
    p.x = p.safeX; p.y = p.safeY - 10; p.vx = 0; p.vy = 0; p.inv = 1.4; p.stun = 0;
    floatText(p.cx, p.y - 10, 'Caiu! -20', '#ff6a5a', 16);
  }

  // ---------- Armas ----------
  fireBullet(p) {
    const x = p.cx + p.face * 30, y = p.y + 8;
    this.bullets.push({ x, y, px: x, vx: p.face * 780, life: 0.9, dead: false });
    p.muzzle = 0.06; Sfx.shoot();
    for (let i = 0; i < 3; i++) addPart(x + p.face * 6, y, p.face * rand(60, 180), rand(-60, 60), 0.15, '#ffe9a0', 2.5, 0);
  }
  updateBullets(dt) {
    const d = this.dino;
    for (const b of this.bullets) {
      b.px = b.x; b.x += b.vx * dt; b.life -= dt;
      if (b.life <= 0) { b.dead = true; continue; }
      for (const s of this._solids) if (pointIn(b.x, b.y, s)) { b.dead = true; sparks(b.x, b.y, 4, '#d8d0c0'); break; }
      if (b.dead || d.dead || !this.fight) continue;
      const boxes = d.hurtboxes(), n = Math.max(1, Math.ceil(Math.abs(b.x - b.px) / 6));
      outer: for (let i = 1; i <= n; i++) {
        const xx = b.px + (b.x - b.px) * i / n;
        for (const box of boxes) if (pointIn(xx, b.y, box)) { this.bulletHit(b, box, xx); break outer; }
      }
    }
    this.bullets = this.bullets.filter(b => !b.dead);
  }
  bulletHit(b, box, xx) {
    const d = this.dino; b.dead = true;
    if (box.armor) { sparks(xx, b.y, 8, '#fff2a0'); Sfx.deflect(); this.hint('armor', xx, b.y - 20, 'Blindado!', '#d0e0ff'); return; }
    if (box.absorb) {
      burst(xx, b.y, 5, '#9aa28a', 120, 0.3, 3, 200); Sfx.thud();
      this.hint('absorb', xx, b.y - 20, 'Couro grosso! Mire na cabeça', '#d0e0ff'); return;
    }
    if (!d.takeHit(7 * (box.mult || 1), sign(b.vx), 60, 'bullet')) return;
    Sfx.hit(); sparks(xx, b.y, 6, box.mult > 1 ? '#ffd860' : '#ffffff');
    if (box.mult > 1.4) this.hint('weak', xx, b.y - 34, 'PONTO FRACO!', '#ffd860', 12);
  }
  knifeCheck(p) {
    const d = this.dino;
    if (d.dead || !this.fight || !d.active) return;
    const kb = p.knifeBox(); let best = null, rank = -1;
    for (const box of d.hurtboxes()) {
      if (!overlap(kb, box)) continue;
      const r = box.armor ? 0 : box.absorb ? 1 : 2 + (box.mult || 1);
      if (r > rank) { rank = r; best = box; }
    }
    if (!best) return;
    p.knifeHit = true;
    const hx = p.face > 0 ? Math.max(kb.x, best.x) + 6 : Math.min(kb.x + kb.w, best.x + best.w) - 6;
    const hy = clamp(p.y + 18, best.y, best.y + best.h);
    if (best.armor) {
      d.takeHit(16 * 0.2, p.face, 40, 'knife'); sparks(hx, hy, 10, '#fff2a0'); Sfx.deflect(); this.hitStop = 0.04;
      this.hint('armor', hx, hy - 20, 'Blindado!', '#d0e0ff'); return;
    }
    const mult = best.absorb ? 0.35 : (best.mult || 1);
    d.takeHit(16 * mult, p.face, 220, 'knife');
    this.hitStop = 0.075; this.shake(4); Sfx.hit(); Sfx.thud();
    burst(hx, hy, 10, '#fff6d0', 260, 0.35, 3, 300); sparks(hx, hy, 6, '#ffd860');
    if (mult > 1.4) this.hint('weak', hx, hy - 34, 'PONTO FRACO!', '#ffd860', 12);
  }
  dinoVsPlayer() {
    const d = this.dino, p = this.player;
    if (d.dead || !d.active || p.dead) return;
    const pb = p.box();
    for (const a of d.attackBoxes()) if (overlap(pb, a)) { p.hurt(a.dmg, sign(p.cx - d.x), a.kb, a.kby); return; }
    for (const c of d.contactBoxes()) {
      if (!overlap(pb, c)) continue;
      if (d.contactDmg > 0) p.hurt(d.contactDmg, sign(p.cx - d.x), 300, 300);
      else { p.x += sign(p.cx - d.x) * 5; if (p.vy > 0 && p.y + p.h < c.y + 20) { p.vy = -380; p.jumping = false; } }
      return;
    }
  }

  // ---------- Perigos ----------
  updateHazards() {
    const L = this.level, p = this.player;
    for (const v of L.vents) {
      if (L.ventState(v, this.levelT) === 2) {
        if (Math.random() < 0.4) addPart(v.x + rand(4, v.w - 4), GROUND_Y - rand(0, 150), rand(-30, 30), rand(-200, -80), 0.5,
          L.th.pit === 'lava' ? '#ffb040' : '#eef4f4', rand(3, 6), 0, 'circ');
        if (!p.dead && overlap(p.box(), { x: v.x, y: GROUND_Y - 170, w: v.w, h: 170 })) p.hurt(12, sign(p.cx - (v.x + v.w / 2)), 200, 820);
      }
    }
    if (p.dead) return;
    for (const s of L.spikes) if (overlap(p.box(), s)) { p.hurt(15, p.vx > 0 ? -1 : 1, 220, 520); break; }
  }
  spawnWave(x, dir, speed, dmg) { this.waves.push({ x, dir, speed, dmg, life: 2.6 }); }
  updateWaves(dt) {
    const p = this.player;
    for (const w of this.waves) {
      w.x += w.dir * w.speed * dt; w.life -= dt;
      if (w.x < this.arena.x0 - 10 || w.x > this.arena.x1 + 10) w.life = 0;
      if (Math.random() < 0.5) dust(w.x, GROUND_Y, 1, '#b8a888', 0.5);
      if (!p.dead && p.onGround && p.y + p.h >= GROUND_Y - 2 && Math.abs(p.cx - w.x) < 22) p.hurt(w.dmg, w.dir, 260, 560);
    }
    this.waves = this.waves.filter(w => w.life > 0);
  }
  spawnDebris(x, delay) {
    let land = GROUND_Y;
    for (const o of this.level.oneways) if (x > o.x && x < o.x + o.w && o.y < land) land = o.y;
    this.debris.push({ x, y: -40, vy: 0, warn: delay, max: delay, land, size: rand(16, 24), rot: rand(0, 6), vr: rand(-6, 6),
      kind: Math.random() < 0.5 ? 'rock' : 'branch', done: false });
  }
  updateDebris(dt) {
    const p = this.player;
    for (const d of this.debris) {
      if (d.warn > 0) { d.warn -= dt; continue; }
      d.vy += 1600 * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      const box = { x: d.x - d.size / 2, y: d.y - d.size / 2, w: d.size, h: d.size };
      const col = d.kind === 'rock' ? '#8a8070' : '#6a4a2a';
      if (!p.dead && overlap(p.box(), box)) { p.hurt(14, sign(p.cx - d.x), 180, 200); d.done = true; burst(d.x, d.y, 8, col, 220, 0.5, 4, 900); }
      else if (d.y + d.size / 2 >= d.land) { d.done = true; burst(d.x, d.land - 4, 8, col, 220, 0.5, 4, 900); dust(d.x, d.land, 4); Sfx.thud(); }
    }
    this.debris = this.debris.filter(d => !d.done);
  }

  // ---------- Itens, chave e portão ----------
  updateItems(dt) {
    const p = this.player;
    for (const it of this.level.items) {
      if (it.taken) {
        if (it.resp > 0) { it.t += dt; if (it.t > it.resp) { it.taken = false; it.t = 0; } }
        continue;
      }
      if (p.dead || !overlap(p.box(), { x: it.x - 14, y: it.y - 26, w: 28, h: 26 })) continue;
      if (it.type === 'a') {
        if (p.ammo >= p.maxAmmo) continue;
        p.ammo = Math.min(p.maxAmmo, p.ammo + 12); Sfx.pickup(); floatText(it.x, it.y - 34, '+12 munição', '#ffe066', 14);
      } else {
        if (p.hp >= p.maxHp) continue;
        p.hp = Math.min(p.maxHp, p.hp + 35); Sfx.heal(); floatText(it.x, it.y - 34, '+35 vida', '#7dff8a', 14);
      }
      it.taken = true; it.t = 0;
      burst(it.x, it.y - 12, 10, it.type === 'a' ? '#ffe066' : '#7dff8a', 160, 0.4, 3, 200);
    }
  }
  dropKey(x, y) {
    this.keyItem = { x: clamp(x, this.arena.x0 + 40, this.arena.x1 - 80), y, vy: -420, landed: false, t: 0 };
    Sfx.key(); sparks(x, y, 12, '#ffd860');
  }
  onBossDefeated(d) { this.won = true; this.banner(d.name + ' derrotado!', '#7dff8a', 'Pegue a chave para abrir o portão'); }
  updateKeyGate(dt) {
    const k = this.keyItem, p = this.player, gx = this.level.AX + 920;
    if (k && !this.hasKey) {
      k.t += dt;
      if (!k.landed) {
        k.vy += 1400 * dt; k.y += k.vy * dt;
        if (k.y >= GROUND_Y - 16) { k.y = GROUND_Y - 16; k.landed = true; dust(k.x, GROUND_Y, 5, '#e8d890'); }
      }
      if (!p.dead && overlap(p.box(), { x: k.x - 16, y: k.y - 16, w: 32, h: 32 })) {
        this.hasKey = true; this.keyItem = null; Sfx.key();
        this.banner('Chave obtida!', '#ffd860', 'Vá até o portão à direita');
      }
    }
    if (this.hasKey && !this.gateOpening && p.x + p.w > gx - 40) { this.gateOpening = true; Sfx.gate(); this.shake(3); }
    if (this.gateOpening && this.gateOpen < 1) this.gateOpen = Math.min(1, this.gateOpen + dt * 1.1);
    if (this.gateOpen >= 1 && p.x > gx + 4 && !p.dead) { this.state = 'clear'; this.stateT = 0; Sfx.pickup(); }
  }

  // ---------- Efeitos e câmera ----------
  updateFx(dt) {
    for (const q of this.parts) { q.life -= dt; q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.pow(0.3, dt); }
    this.parts = this.parts.filter(q => q.life > 0);
    for (const tx of this.texts) { tx.life -= dt; tx.y -= 30 * dt; }
    this.texts = this.texts.filter(tx => tx.life > 0);
    for (const r of this.rings) { r.life -= dt; r.r += 520 * dt; }
    this.rings = this.rings.filter(r => r.life > 0);
    this.bannerT = Math.max(0, this.bannerT - dt);
    this.bossShow = approach(this.bossShow, Math.max(0, this.dino.hp), Math.max(60, this.dino.maxHp * 0.4) * dt);
    const p = this.player, L = this.level;
    const tx = this.fight ? L.AX : clamp(p.cx - W * 0.4 + p.face * 40, 0, L.AX);
    this.cam.x = lerp(this.cam.x, tx, 1 - Math.pow(0.002, dt));
    this.shakeMag *= Math.pow(0.01, dt);
    if (this.shakeMag < 0.3) this.shakeMag = 0;
    this.sx = rand(-1, 1) * this.shakeMag; this.sy = rand(-1, 1) * this.shakeMag;
  }
}

// =========================================================
//  JOGO: desenho do mundo, HUD e telas
// =========================================================
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
function bar(c, x, y, w, h, col) {
  c.fillStyle = col;
  if (w <= 0) return;
  if (w < 8) c.fillRect(x, y, w, h); else { roundRect(c, x, y, w, h, Math.min(4, h / 2)); c.fill(); }
}
function txt(c, s, x, y, font, col, align = 'center', stroke = null) {
  c.font = font; c.textAlign = align; c.textBaseline = 'middle';
  if (stroke) { c.lineWidth = 5; c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(s, x, y); }
  c.fillStyle = col; c.fillText(s, x, y);
}

Object.assign(Game.prototype, {
  draw() {
    const c = ctx;
    c.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    const L = this.level, camX = Math.round(this.cam.x * 2) / 2;
    const tt = this.state === 'title' ? this.t : this.levelT;
    L.drawBg(c, camX, this.t);
    c.save(); c.translate(-camX + this.sx, this.sy);
    L.drawTerrain(c, camX, tt, this.treeShake);
    this.drawGate(c);
    this.drawItems(c);
    for (const d of this.debris) this.drawDebrisShadow(c, d);
    if (this.state !== 'title') this.dino.draw(c);
    this.drawKey(c);
    if (this.state !== 'clear' && this.state !== 'title') this.player.draw(c);
    this.drawWaves(c);
    for (const b of this.bullets) {
      const dir = sign(b.vx);
      c.fillStyle = 'rgba(255,230,140,0.45)'; c.fillRect(dir > 0 ? b.x - 20 : b.x, b.y - 1, 20, 2);
      c.fillStyle = '#fff8d0'; c.fillRect(b.x - 4, b.y - 2, 8, 4);
    }
    for (const d of this.debris) this.drawDebris(c, d);
    this.drawParticles(c);
    for (const r of this.rings) {
      const a = clamp(r.life / 0.9, 0, 1);
      c.strokeStyle = 'rgba(255,240,220,' + (a * 0.8) + ')'; c.lineWidth = 2 + 6 * a;
      c.beginPath(); c.arc(r.x, r.y, r.r, 0, Math.PI * 2); c.stroke();
    }
    for (const t of this.texts) {
      c.globalAlpha = clamp(t.life / t.max * 1.5, 0, 1);
      txt(c, t.text, t.x, t.y, 'bold ' + t.size + 'px ' + FONT, t.color, 'center', 'rgba(0,0,0,0.75)');
    }
    c.globalAlpha = 1;
    c.restore();
    if (this.dino.phase2 && !this.dino.dead && this.state === 'play') {
      c.fillStyle = 'rgba(160,20,0,' + (0.06 + 0.04 * Math.sin(this.t * 4)) + ')'; c.fillRect(0, 0, W, H);
    }
    if (this.state !== 'title') this.drawHUD(c);
    this.drawOverlay(c);
  },

  drawGate(c) {
    const L = this.level, ax = L.AX, gx = ax + 920, top = GROUND_Y - 200;
    if (this.barrier > 0) {
      const by = lerp(-330, 0, easeOut(this.barrier));
      for (let i = 0; i < 3; i++) {
        const lx = ax - 4 + i * 8, ly = GROUND_Y - 230 + by + (i % 2) * 8;
        c.fillStyle = i % 2 ? '#6a4a2a' : '#7c5632'; c.fillRect(lx, ly, 8, 230 - (i % 2) * 8);
        c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + 4, ly - 12); c.lineTo(lx + 8, ly); c.fill();
      }
      c.fillStyle = '#c9a76a'; c.fillRect(ax - 6, GROUND_Y - 190 + by, 28, 5); c.fillRect(ax - 6, GROUND_Y - 70 + by, 28, 5);
    }
    c.fillStyle = '#5e564c'; c.fillRect(gx - 6, top, 10, 200); c.fillRect(gx + 36, top, 10, 200);
    c.save(); c.beginPath(); c.rect(gx + 4, top + 20, 32, 180); c.clip();
    c.fillStyle = 'rgba(255,240,180,0.5)'; c.fillRect(gx + 4, top + 20, 32, 180);
    const lift = this.gateOpen * 182;
    c.fillStyle = '#3a2c1e'; c.fillRect(gx + 4, top + 20 - lift, 32, 180);
    c.fillStyle = '#6a5038'; for (let i = 0; i < 4; i++) c.fillRect(gx + 5 + i * 8, top + 20 - lift, 5, 180);
    c.fillStyle = '#2a2a2a'; c.fillRect(gx + 4, top + 60 - lift, 32, 4); c.fillRect(gx + 4, top + 140 - lift, 32, 4);
    c.restore();
    c.fillStyle = '#6e665a'; c.fillRect(gx - 12, top - 4, 64, 26);
    c.fillStyle = '#e8e0cc'; c.beginPath(); c.arc(gx + 20, top + 7, 7, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#3a342c'; c.fillRect(gx + 16, top + 5, 3, 3); c.fillRect(gx + 22, top + 5, 3, 3);
    if (!this.gateOpening) {
      const ly = GROUND_Y - 100;
      c.strokeStyle = '#c8a030'; c.lineWidth = 3; c.beginPath(); c.arc(gx + 20, ly - 6, 6, Math.PI, 0); c.stroke();
      c.fillStyle = '#e8c040'; c.fillRect(gx + 12, ly - 6, 16, 14);
      c.fillStyle = '#4a3a10'; c.fillRect(gx + 19, ly, 2, 5);
      if (this.hasKey) {
        const bob = Math.sin(this.t * 6) * 6;
        txt(c, 'Portão →', gx - 60 + bob, GROUND_Y - 130, 'bold 18px ' + FONT, '#ffd860', 'center', 'rgba(0,0,0,0.7)');
      }
    }
  },

  drawItems(c) {
    for (const it of this.level.items) {
      if (it.taken) continue;
      const y = it.y - 2 + Math.sin(this.t * 3 + it.bob) * 2;
      c.fillStyle = 'rgba(255,240,150,0.18)'; c.beginPath(); c.arc(it.x, y - 12, 20, 0, Math.PI * 2); c.fill();
      if (it.type === 'a') {
        c.fillStyle = '#e8c860'; for (let i = 0; i < 3; i++) c.fillRect(it.x - 8 + i * 6, y - 29, 4, 9);
        c.fillStyle = '#7a5a2e'; roundRect(c, it.x - 13, y - 22, 26, 20, 3); c.fill();
        c.strokeStyle = '#4a3418'; c.lineWidth = 2; c.strokeRect(it.x - 13, y - 22, 26, 20);
        c.beginPath(); c.moveTo(it.x - 13, y - 22); c.lineTo(it.x + 13, y - 2); c.stroke();
      } else {
        c.fillStyle = '#f2f2ea'; roundRect(c, it.x - 12, y - 21, 24, 19, 4); c.fill();
        c.fillStyle = '#2fb84f'; c.fillRect(it.x - 2.5, y - 18, 5, 13); c.fillRect(it.x - 7, y - 14, 14, 5);
      }
    }
  },

  drawKeyIcon(c, x, y, s, col) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.strokeStyle = col; c.lineWidth = 3.5; c.beginPath(); c.arc(-6, 0, 6, 0, Math.PI * 2); c.stroke();
    c.fillStyle = col; c.fillRect(0, -2, 16, 4); c.fillRect(10, 2, 3, 5); c.fillRect(14, 2, 3, 4);
    c.restore();
  },
  drawKey(c) {
    const k = this.keyItem;
    if (!k) return;
    const y = k.y + (k.landed ? Math.sin(this.t * 4) * 3 : 0);
    c.fillStyle = 'rgba(255,220,90,0.3)'; c.beginPath(); c.arc(k.x, y, 22 + Math.sin(this.t * 6) * 3, 0, Math.PI * 2); c.fill();
    this.drawKeyIcon(c, k.x - 4, y, 1.4, '#ffd23a');
    if (k.landed) {
      const ay = y - 44 + Math.sin(this.t * 5) * 4;
      txt(c, 'CHAVE', k.x, ay - 12, 'bold 13px ' + FONT, '#ffd860', 'center', 'rgba(0,0,0,0.7)');
      c.fillStyle = '#ffd860'; c.beginPath(); c.moveTo(k.x - 7, ay); c.lineTo(k.x + 7, ay); c.lineTo(k.x, ay + 9); c.closePath(); c.fill();
    }
  },

  drawDebrisShadow(c, d) {
    const k = d.warn > 0 ? 1 - d.warn / d.max : 1;
    ellipse(c, d.x, d.land + 1, 8 + 16 * k, 4 + 2 * k, 0, 'rgba(0,0,0,' + (0.25 + 0.3 * k) + ')');
    c.strokeStyle = 'rgba(255,60,40,' + (0.45 + 0.4 * Math.sin(this.t * 20)) + ')'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(d.x, d.land + 1, 12 + 16 * k, 7, 0, 0, Math.PI * 2); c.stroke();
  },
  drawDebris(c, d) {
    if (d.warn > 0) return;
    c.save(); c.translate(d.x, d.y); c.rotate(d.rot);
    if (d.kind === 'rock') {
      c.fillStyle = '#857a6a'; c.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2, r = d.size / 2 * (0.75 + ((i * 37) % 10) / 30); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
      c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.2)'; c.fillRect(-3, -d.size / 4, 6, 3);
    } else {
      c.fillStyle = '#5e4026'; c.fillRect(-d.size * 0.8, -3, d.size * 1.6, 6);
      ellipse(c, d.size * 0.6, -4, 8, 5, 0, '#3f7a35'); ellipse(c, -d.size * 0.4, 3, 7, 4, 0, '#3f7a35');
    }
    c.restore();
  },
  drawWaves(c) {
    for (const w of this.waves) {
      const a = Math.min(1, w.life);
      c.fillStyle = 'rgba(214,190,140,' + (0.9 * a) + ')';
      c.beginPath(); c.moveTo(w.x - w.dir * 30, GROUND_Y + 2);
      c.quadraticCurveTo(w.x - w.dir * 4, GROUND_Y - 44, w.x + w.dir * 12, GROUND_Y + 2); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(120,80,40,' + a + ')'; c.lineWidth = 2; c.stroke();
      c.fillStyle = 'rgba(255,90,60,' + (0.5 * a) + ')'; c.fillRect(w.x - 14, GROUND_Y - 2, 28, 4);
    }
  },
  drawParticles(c) {
    for (const q of this.parts) {
      c.globalAlpha = clamp(q.life / q.max, 0, 1);
      if (q.kind === 'line') {
        c.strokeStyle = q.color; c.lineWidth = q.size;
        c.beginPath(); c.moveTo(q.x, q.y); c.lineTo(q.x - q.vx * 0.03, q.y - q.vy * 0.03); c.stroke();
      } else if (q.kind === 'circ') {
        c.fillStyle = q.color; c.beginPath(); c.arc(q.x, q.y, q.size * (0.5 + 0.5 * q.life / q.max), 0, Math.PI * 2); c.fill();
      } else { c.fillStyle = q.color; c.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size); }
    }
    c.globalAlpha = 1;
  },
  heart(c, x, y, col) {
    c.fillStyle = col; c.beginPath(); c.moveTo(x, y + 8);
    c.bezierCurveTo(x - 13, y - 1, x - 7, y - 11, x, y - 4);
    c.bezierCurveTo(x + 7, y - 11, x + 13, y - 1, x, y + 8); c.fill();
  },

  drawHUD(c) {
    const p = this.player, d = this.dino;
    c.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(c, 12, 10, 266, 68, 10); c.fill();
    this.heart(c, 30, 28, '#e8484a');
    bar(c, 46, 20, 220, 16, '#2a1010');
    const r = clamp(p.hp / p.maxHp, 0, 1);
    bar(c, 48, 22, 216 * r, 12, r > 0.5 ? '#4fd065' : r > 0.25 ? '#f0c040' : '#ff4a3a');
    txt(c, Math.ceil(p.hp) + ' / ' + p.maxHp, 156, 28.5, 'bold 11px ' + FONT, '#fff');
    c.fillStyle = '#e8c860'; roundRect(c, 22, 50, 5, 14, 2.5); c.fill(); roundRect(c, 30, 50, 5, 14, 2.5); c.fill();
    txt(c, 'Munição: ' + p.ammo, 46, 58, 'bold 15px ' + FONT, p.ammo > 0 ? '#fff' : '#ff7a6a', 'left');
    txt(c, 'Faca: ∞', 160, 58, '13px ' + FONT, '#cfd8cf', 'left');
    this.drawKeyIcon(c, 246, 58, 1, this.hasKey ? '#ffd23a' : 'rgba(255,255,255,0.25)');
    c.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(c, W - 184, 10, 172, 54, 10); c.fill();
    txt(c, 'Fase ' + (this.levelIndex + 1) + ' de ' + LEVELS.length, W - 24, 28, 'bold 15px ' + FONT, '#fff', 'right');
    txt(c, 'Tempo ' + fmtTime(this.totalTime), W - 24, 48, '14px ' + FONT, '#ffe9a8', 'right');
    if (this.fight && (!d.dead || d.deathT < 2.5)) {
      const bw = 420, bx = W / 2 - bw / 2;
      c.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(c, bx - 10, 8, bw + 20, 46, 10); c.fill();
      txt(c, d.name + (d.phase2 ? ' — FÚRIA' : ''), W / 2, 21, 'bold 15px ' + FONT, d.phase2 ? '#ff8a5a' : '#ffd860');
      bar(c, bx, 31, bw, 14, '#2a1010');
      bar(c, bx + 2, 33, (bw - 4) * this.bossShow / d.maxHp, 10, 'rgba(255,255,255,0.6)');
      bar(c, bx + 2, 33, (bw - 4) * Math.max(0, d.hp) / d.maxHp, 10, d.phase2 ? '#ff5a2a' : '#d8342a');
      if (d instanceof TRex) { c.fillStyle = '#fff'; c.fillRect(W / 2 - 1, 29, 2, 18); }
    }
    if (this.bannerT > 0) {
      const a = clamp(Math.min(this.bannerT * 2, (3.2 - this.bannerT) * 4), 0, 1);
      c.globalAlpha = a;
      c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(0, 112, W, this.bannerSub ? 78 : 52);
      txt(c, this.bannerText, W / 2, 138, 'bold 30px ' + FONT, this.bannerCol);
      if (this.bannerSub) txt(c, this.bannerSub, W / 2, 172, '16px ' + FONT, '#ffffff');
      c.globalAlpha = 1;
    }
    if (this.state === 'play') {
      if (this.levelIndex === 0 && this.levelT < 9) {
        c.globalAlpha = clamp(9 - this.levelT, 0, 1);
        c.fillStyle = 'rgba(0,0,0,0.5)'; roundRect(c, W / 2 - 330, H - 46, 660, 32, 8); c.fill();
        txt(c, 'Setas/A-D: mover  ·  Espaço/W: pular  ·  J: atirar  ·  K: faca  ·  P: pausa', W / 2, H - 30, '15px ' + FONT, '#fff');
        c.globalAlpha = 1;
      }
      if (p.stun > 0 && !p.dead) txt(c, 'ATORDOADO!', W / 2, H / 2 - 120, 'bold 26px ' + FONT, '#ffe066', 'center', 'rgba(0,0,0,0.7)');
    }
    if (Sfx.muted) txt(c, 'Som desligado (M)', W - 24, 76, '12px ' + FONT, '#ddd', 'right', 'rgba(0,0,0,0.6)');
  },

  drawOverlay(c) {
    const dim = a => { c.fillStyle = 'rgba(6,8,5,' + a + ')'; c.fillRect(0, 0, W, H); };
    const blink = Math.sin(this.t * 5) > -0.3;
    const L = this.level;
    switch (this.state) {
      case 'title': this.drawTitle(c, dim, blink); break;
      case 'card': {
        const a = clamp(Math.min(this.stateT * 3, (2.6 - this.stateT) * 3), 0, 1);
        dim(0.65 * a); c.globalAlpha = a;
        txt(c, 'Fase ' + (this.levelIndex + 1) + ' — ' + BOSS_NAMES[L.d.boss], W / 2, 215, 'bold 46px ' + FONT, '#ffd860', 'center', '#2a1a0a');
        txt(c, L.d.place, W / 2, 266, 'italic 22px ' + FONT, '#e8f0e0');
        txt(c, 'Atravesse a trilha, derrote o dinossauro, pegue a chave e abra o portão.', W / 2, 318, '16px ' + FONT, '#c8d4c0');
        c.globalAlpha = 1;
        break;
      }
      case 'paused':
        dim(0.6);
        txt(c, 'PAUSADO', W / 2, 220, 'bold 52px ' + FONT, '#ffffff', 'center', '#000');
        txt(c, 'P, Esc ou Enter para continuar', W / 2, 280, '18px ' + FONT, '#e0e8e0');
        txt(c, 'R para recomeçar do início  ·  M liga/desliga o som', W / 2, 310, '16px ' + FONT, '#b8c4b8');
        break;
      case 'clear':
        dim(Math.min(0.6, this.stateT));
        txt(c, 'Fase concluída!', W / 2, 230, 'bold 46px ' + FONT, '#7dff8a', 'center', '#0a2a0a');
        txt(c, 'Tempo total: ' + fmtTime(this.totalTime), W / 2, 285, '20px ' + FONT, '#ffffff');
        break;
      case 'gameover':
        dim(Math.min(0.75, this.stateT * 1.5));
        txt(c, 'VOCÊ FOI DERROTADO', W / 2, 190, 'bold 48px ' + FONT, '#ff6a5a', 'center', '#2a0a0a');
        txt(c, 'Fase ' + (this.levelIndex + 1) + ' — ' + BOSS_NAMES[L.d.boss], W / 2, 245, '20px ' + FONT, '#e8e0d8');
        if (this.stateT > 0.5) {
          for (const b of this.btns) {
            c.fillStyle = 'rgba(255,255,255,0.12)'; roundRect(c, b.x, b.y, b.w, b.h, 10); c.fill();
            c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2; c.stroke();
            txt(c, b.label, b.x + b.w / 2, b.y + 20, 'bold 17px ' + FONT, '#fff');
            txt(c, '[' + b.key + ']', b.x + b.w / 2, b.y + 39, '13px ' + FONT, '#ffd860');
          }
        }
        break;
      case 'victory': {
        dim(Math.min(0.75, this.stateT));
        txt(c, 'VOCÊ ESCAPOU DA ILHA!', W / 2, 170, 'bold 50px ' + FONT, '#ffd860', 'center', '#2a1a0a');
        txt(c, 'Os cinco dinossauros foram vencidos e o último portão se abriu.', W / 2, 225, '18px ' + FONT, '#e8f0e0');
        txt(c, 'Tempo total: ' + fmtTime(this.totalTime), W / 2, 280, 'bold 28px ' + FONT, '#ffffff');
        txt(c, 'Melhor tempo: ' + fmtTime(this.best), W / 2, 318, '20px ' + FONT, '#bfe8c0');
        if (this.newRecord) txt(c, 'NOVO RECORDE!', W / 2, 356, 'bold 24px ' + FONT, blink ? '#7dff8a' : '#ffd860', 'center', '#0a2a0a');
        if (this.stateT > 1 && blink) txt(c, this.touch ? 'Toque para voltar ao início' : 'Pressione Enter para voltar ao início', W / 2, 420, '18px ' + FONT, '#ffffff');
        txt(c, 'Criado por Nickolas Reis', W / 2, 470, 'italic 14px ' + FONT, '#c8d4c0');
        if (Math.random() < 0.3) {
          addPart(this.cam.x + rand(0, W), -10, rand(-40, 40), rand(60, 160), 2.5,
            ['#ffd860', '#7dff8a', '#ff7a5a', '#7ac8ff'][Math.floor(rand(0, 4))], rand(3, 6), 60);
        }
        break;
      }
    }
  },

  drawTitle(c, dim, blink) {
    dim(0.3);
    const r = this.titleRex; r.anim = this.t;
    c.save(); c.translate(800, GROUND_Y + 8); c.scale(-1.3, 1.3); r.drawBody(c); c.restore();
    const cx = 330;
    c.fillStyle = 'rgba(0,0,0,0.45)'; roundRect(c, cx - 290, 40, 580, 450, 16); c.fill();
    txt(c, 'FUGA JURÁSSICA', cx, 98, 'bold 58px ' + FONT, '#ffd860', 'center', '#3a200a');
    txt(c, 'Escape da ilha e enfrente cinco dinossauros', cx, 146, 'italic 18px ' + FONT, '#e8f0e0');
    const lines = [
      ['Setas ou A / D', 'mover'],
      ['Espaço, W ou Seta ↑', 'pular'],
      ['J', 'atirar (munição limitada)'],
      ['K', 'faca (ilimitada, mais dano)'],
      ['P ou Esc', 'pausar'],
      ['M', 'liga/desliga o som']
    ];
    lines.forEach((l, i) => {
      txt(c, l[0], cx - 10, 194 + i * 30, 'bold 16px ' + FONT, '#ffe9a8', 'right');
      txt(c, l[1], cx + 6, 194 + i * 30, '16px ' + FONT, '#ffffff', 'left');
    });
    if (blink) txt(c, this.touch ? 'Toque na tela para começar' : 'Pressione Enter para começar', cx, 400, 'bold 22px ' + FONT, '#7dff8a', 'center', '#0a2a0a');
    txt(c, this.best ? 'Melhor tempo: ' + fmtTime(this.best) : 'Melhor tempo: ainda não registrado', cx, 448, '15px ' + FONT, '#c8d4c0');
    txt(c, 'Criado por Nickolas Reis', cx, 476, 'italic 13px ' + FONT, '#aab8a4');
  }
});

// =========================================================
//  INICIALIZAÇÃO: tela, toque e laço principal (passo fixo)
// =========================================================
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.max(1, Math.floor(W * s)), ch = Math.max(1, Math.floor(H * s));
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
}
window.addEventListener('resize', resize);
resize();

G = new Game();
G.touch = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
if (G.touch) document.getElementById('touch').classList.add('on');

document.querySelectorAll('.tb').forEach(el => {
  const a = el.dataset.a;
  const down = e => {
    e.preventDefault(); Sfx.init(); el.classList.add('act');
    if (a === 'pause') { if (G.state === 'play') G.pause(); else if (G.state === 'paused') G.state = 'play'; }
    else Input.set(a, true);
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignorado */ }
  };
  const up = e => { e.preventDefault(); el.classList.remove('act'); if (a !== 'pause') Input.set(a, false); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
  el.addEventListener('contextmenu', e => e.preventDefault());
});
canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  G.tap((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  canvas.focus();
});

let lastT = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { G.update(STEP); Input.endStep(); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  G.draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
