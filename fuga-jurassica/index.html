<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="author" content="Nickolas Reis">
<title>Fuga Jurássica</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0f0a; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; box-shadow: 0 0 40px rgba(0,0,0,.6); outline: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb { position: absolute; pointer-events: auto; width: 70px; height: 70px; border-radius: 50%;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4); color: #fff;
    font: bold 14px system-ui, sans-serif; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  .tb.act { background: rgba(255,214,110,.4); }
  #bL { left: 16px; bottom: 20px; }
  #bR { left: 100px; bottom: 20px; }
  #bJ { right: 16px; bottom: 20px; width: 84px; height: 84px; }
  #bS { right: 112px; bottom: 20px; }
  #bK { right: 112px; bottom: 104px; }
  #bP { left: 50%; bottom: 18px; transform: translateX(-50%); width: 48px; height: 48px; font-size: 13px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div>
<div id="touch">
  <div class="tb" id="bL" data-a="left">&#9664;</div>
  <div class="tb" id="bR" data-a="right">&#9654;</div>
  <div class="tb" id="bK" data-a="knife">FACA</div>
  <div class="tb" id="bS" data-a="shoot">TIRO</div>
  <div class="tb" id="bJ" data-a="jump">PULO</div>
  <div class="tb" id="bP" data-a="pause">II</div>
</div>
<script>
'use strict';
/* =========================================================
   FUGA JURÁSSICA - jogo de plataforma e ação 2D (Canvas)
   Tudo desenhado proceduralmente; sons gerados via WebAudio.
   ========================================================= */

// ---------- Constantes e utilidades ----------
const W = 960, H = 540, GROUND_Y = 460, GRAV = 2000, STEP = 1 / 60;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let G = null; // instância do jogo (criada no fim do script)

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sign = v => (v < 0 ? -1 : 1);
const approach = (v, target, amt) => (v < target ? Math.min(v + amt, target) : Math.max(v - amt, target));
const easeOut = t => 1 - (1 - t) * (1 - t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pointIn = (px, py, r) => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

function seeded(seed) {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return String(m).padStart(2, '0') + ':' + s.toFixed(1).padStart(4, '0');
}
function rotAround(px, py, cx, cy, a) {
  const c = Math.cos(a), s = Math.sin(a), dx = px - cx, dy = py - cy;
  return [cx + dx * c - dy * s, cy + dx * s + dy * c];
}

// Armazenamento local sempre protegido (pode estar bloqueado)
const Store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* ignorado */ } }
};

// ---------- Áudio (WebAudio procedural) ----------
const Sfx = {
  ac: null, master: null, noiseBuf: null, muted: false,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.32;
      this.master.connect(this.ac.destination);
      const len = this.ac.sampleRate;
      this.noiseBuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  tone(freq, dur, type = 'square', vol = 0.3, slideTo = null, delay = 0) {
    if (!this.ac || this.muted) return;
    try {
      const t = this.ac.currentTime + delay;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ignorado */ }
  },
  noise(dur, vol = 0.3, freq = 1000, q = 1, type = 'lowpass', delay = 0, slideTo = null) {
    if (!this.ac || this.muted || !this.noiseBuf) return;
    try {
      const t = this.ac.currentTime + delay;
      const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
      const f = this.ac.createBiquadFilter(); f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      const g = this.ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      s.connect(f); f.connect(g); g.connect(this.master);
      s.start(t); s.stop(t + dur + 0.02);
    } catch (e) { /* ignorado */ }
  },
  shoot() { this.noise(0.12, 0.35, 2600, 0.8, 'bandpass'); this.tone(440, 0.08, 'square', 0.1, 110); },
  knife() { this.noise(0.13, 0.22, 1500, 2, 'bandpass', 0, 5200); },
  hit() { this.tone(170, 0.12, 'square', 0.18, 60); this.noise(0.08, 0.25, 900); },
  slash() { this.tone(120, 0.15, 'square', 0.22, 50); this.noise(0.12, 0.35, 1400, 1, 'lowpass', 0, 200); },
  deflect() { this.tone(1900, 0.12, 'triangle', 0.16, 2700); this.tone(2500, 0.08, 'sine', 0.08, 1500, 0.03); },
  thud() { this.noise(0.1, 0.25, 380); },
  jump() { this.tone(300, 0.12, 'square', 0.07, 540); },
  land() { this.noise(0.05, 0.1, 500); },
  pickup() { [660, 880, 1320].forEach((f, i) => this.tone(f, 0.1, 'square', 0.1, null, i * 0.07)); },
  heal() { this.tone(520, 0.16, 'triangle', 0.2, 780); this.tone(780, 0.2, 'triangle', 0.15, 1040, 0.1); },
  hurt() { this.tone(230, 0.25, 'sawtooth', 0.18, 80); this.noise(0.15, 0.2, 600); },
  roar(big) {
    const d = big ? 1.3 : 0.7;
    this.tone(big ? 95 : 150, d, 'sawtooth', 0.32, big ? 45 : 75);
    this.tone(big ? 140 : 210, d, 'square', 0.1, big ? 60 : 95);
    this.noise(d, 0.35, big ? 600 : 1000, 1, 'lowpass', 0, 150);
  },
  stomp() { this.tone(70, 0.45, 'sine', 0.5, 30); this.noise(0.4, 0.4, 320, 1, 'lowpass', 0, 60); },
  crash() { this.tone(110, 0.3, 'square', 0.28, 40); this.noise(0.35, 0.45, 900, 0.7, 'lowpass', 0, 100); },
  key() { [880, 1175, 1568, 2093].forEach((f, i) => this.tone(f, 0.15, 'triangle', 0.15, null, i * 0.08)); },
  gate() { this.tone(110, 0.6, 'sawtooth', 0.1, 170); this.noise(0.6, 0.15, 400); },
  die() { this.tone(320, 0.8, 'sawtooth', 0.2, 60); },
  dinoDie() { this.tone(210, 1.0, 'sawtooth', 0.24, 50); this.noise(0.8, 0.25, 700, 1, 'lowpass', 0, 100); },
  empty() { this.tone(200, 0.05, 'square', 0.07); },
  win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'square', 0.1, null, i * 0.13)); }
};

// ---------- Entrada (teclado + toque) ----------
const Input = {
  held: {}, pressed: {},
  map: {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', KeyW: 'jump', ArrowUp: 'jump', KeyJ: 'shoot', KeyK: 'knife',
    KeyP: 'pause', Escape: 'pause', Enter: 'enter', NumpadEnter: 'enter', KeyR: 'restart', KeyM: 'mute'
  },
  set(action, down) {
    if (down && !this.held[action]) this.pressed[action] = true;
    this.held[action] = down;
  },
  take(action) {
    if (this.pressed[action]) { this.pressed[action] = false; return true; }
    return false;
  },
  endStep() { this.pressed = {}; },
  clearAll() { this.held = {}; this.pressed = {}; }
};
window.addEventListener('keydown', e => {
  Sfx.init();
  const a = Input.map[e.code];
  if (a) { e.preventDefault(); if (!e.repeat) Input.set(a, true); }
});
window.addEventListener('keyup', e => {
  const a = Input.map[e.code];
  if (a) { e.preventDefault(); Input.set(a, false); }
});
window.addEventListener('blur', () => {
  Input.clearAll();
  if (G && G.state === 'play') G.pause();
});

// ---------- Efeitos: partículas e textos ----------
function addPart(x, y, vx, vy, life, color, size, grav = 0, kind = 'sq') {
  if (G.parts.length > 600) return;
  G.parts.push({ x, y, vx, vy, life, max: life, color, size, grav, kind });
}
function burst(x, y, n, color, spd = 200, life = 0.5, size = 3, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(life * 0.5, life), color, rand(size * 0.6, size * 1.3), grav);
  }
}
function dust(x, y, n, color = '#b9a27a', spread = 1) {
  for (let i = 0; i < n; i++) {
    addPart(x + rand(-10, 10) * spread, y - 2, rand(-120, 120) * spread, rand(-170, -30), rand(0.4, 0.8), color, rand(3, 7), 300, 'circ');
  }
}
function sparks(x, y, n, color = '#ffd860') {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(150, 420);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rand(0.15, 0.35), color, rand(1.5, 3), 400, 'line');
  }
}
function floatText(x, y, text, color = '#fff', size = 16) {
  G.texts.push({ x, y, text, color, size, life: 1.1, max: 1.1 });
}

// ---------- Auxiliares de desenho ----------
// Membro de dois segmentos com IK simples (quadril -> pé); bend define o lado do joelho.
function leg(c, hx, hy, fx, fy, len, bend, w1, w2, col) {
  const dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy) || 1;
  const a = len / 2;
  let kx = (hx + fx) / 2, ky = (hy + fy) / 2;
  if (d < len) {
    const h = Math.sqrt(Math.max(0, a * a - (d / 2) * (d / 2)));
    kx += (-dy / d) * h * bend; ky += (dx / d) * h * bend;
  }
  c.strokeStyle = col; c.lineCap = 'round';
  c.lineWidth = w1; c.beginPath(); c.moveTo(hx, hy); c.lineTo(kx, ky); c.stroke();
  c.lineWidth = w2; c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx, fy); c.stroke();
  return [kx, ky];
}
// Forma afunilada ao longo de uma curva quadrática (caudas e pescoços)
function taper(c, x0, y0, cx, cy, x1, y1, w0, w1, col) {
  const N = 14, L = [], R = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, mt = 1 - t;
    const x = mt * mt * x0 + 2 * mt * t * cx + t * t * x1;
    const y = mt * mt * y0 + 2 * mt * t * cy + t * t * y1;
    const tx = 2 * mt * (cx - x0) + 2 * t * (x1 - cx), ty = 2 * mt * (cy - y0) + 2 * t * (y1 - cy);
    const tl = Math.hypot(tx, ty) || 1, nx = -ty / tl, ny = tx / tl, w = lerp(w0, w1, t) / 2;
    L.push([x + nx * w, y + ny * w]); R.push([x - nx * w, y - ny * w]);
  }
  c.fillStyle = col; c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (const p of L) c.lineTo(p[0], p[1]);
  for (let i = R.length - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fill();
}
function ellipse(c, x, y, rx, ry, rot, col) {
  c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); c.fill();
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function drawStars(c, x, y, t, r = 18) {
  for (let i = 0; i < 3; i++) {
    const a = t * 5 + i * 2.094, sx = x + Math.cos(a) * r, sy = y + Math.sin(a) * r * 0.35;
    c.fillStyle = '#ffe866'; c.beginPath();
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 ? 2.5 : 6, aa = k * Math.PI / 5 + t * 3;
      c.lineTo(sx + Math.cos(aa) * rr, sy + Math.sin(aa) * rr);
    }
    c.closePath(); c.fill();
  }
}

// =========================================================
//  JOGADOR
// =========================================================
class Player {
  constructor() {
    this.maxHp = 100; this.hp = 100; this.ammo = 15; this.maxAmmo = 40;
    this.reset(80, GROUND_Y - 46);
  }
  reset(x, y) {
    this.x = x; this.y = y; this.w = 22; this.h = 46; this.vx = 0; this.vy = 0; this.face = 1;
    this.onGround = false; this.standSolid = false; this.jumping = false;
    this.inv = 0; this.shootCd = 0; this.knifeT = 0; this.knifeCd = 0; this.knifeHit = false;
    this.coyote = 0; this.jumpBuf = 0; this.stun = 0; this.lock = 0;
    this.anim = 0; this.t = 0; this.muzzle = 0; this.aimT = 0; this.emptyT = 0;
    this.safeX = x; this.safeY = y; this.dead = false; this.deadT = 0;
  }
  get cx() { return this.x + this.w / 2; }
  box() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  knifeBox() { return { x: this.face > 0 ? this.x + this.w - 4 : this.x - 38, y: this.y + 2, w: 42, h: 34 }; }

  update(dt) {
    this.t += dt;
    if (this.dead) {
      this.deadT += dt; this.vy = Math.min(this.vy + GRAV * dt, 1100);
      this.vx = approach(this.vx, 0, 600 * dt); this.moveAndCollide(dt); return;
    }
    this.inv = Math.max(0, this.inv - dt); this.stun = Math.max(0, this.stun - dt);
    this.lock = Math.max(0, this.lock - dt); this.muzzle = Math.max(0, this.muzzle - dt);
    this.aimT = Math.max(0, this.aimT - dt); this.emptyT -= dt;
    this.shootCd -= dt; this.knifeCd -= dt;
    const can = this.stun <= 0 && this.lock <= 0;

    // Movimento horizontal
    let mv = 0;
    if (can) { if (Input.held.left) mv -= 1; if (Input.held.right) mv += 1; }
    if (mv) {
      this.vx = approach(this.vx, mv * 270, (this.onGround ? 2600 : 1600) * dt);
      if (this.knifeT <= 0) this.face = mv;
    } else if (this.lock <= 0) {
      this.vx = approach(this.vx, 0, (this.onGround ? 2400 : 700) * dt);
    }

    // Pulo com buffer e "coyote time"
    if (Input.take('jump')) this.jumpBuf = 0.12; else this.jumpBuf -= dt;
    this.coyote = this.onGround ? 0.09 : this.coyote - dt;
    if (can && this.jumpBuf > 0 && this.coyote > 0) {
      this.vy = -730; this.jumpBuf = 0; this.coyote = 0; this.onGround = false; this.jumping = true;
      Sfx.jump(); dust(this.cx, this.y + this.h, 4);
    }
    if (this.jumping && !Input.held.jump && this.vy < -280) this.vy = -280;
    if (this.vy >= 0) this.jumping = false;

    // Ataques
    if (can) {
      if (Input.held.shoot && this.shootCd <= 0 && this.knifeT <= 0) {
        if (this.ammo > 0) {
          this.ammo--; this.shootCd = 0.24; this.aimT = 0.35; G.fireBullet(this);
        } else {
          this.shootCd = 0.3; Sfx.empty();
          if (this.emptyT <= 0) { floatText(this.cx, this.y - 12, 'Sem munição! Use a faca', '#ff9a7a', 13); this.emptyT = 1.5; }
        }
      }
      if ((Input.take('knife') || Input.held.knife) && this.knifeCd <= 0) {
        this.knifeT = 0.22; this.knifeCd = 0.42; this.knifeHit = false; Sfx.knife();
      }
    }
    if (this.knifeT > 0) {
      this.knifeT -= dt;
      const ph = 0.22 - this.knifeT;
      if (ph > 0.04 && ph < 0.16 && !this.knifeHit) G.knifeCheck(this);
    }

    this.vy = Math.min(this.vy + GRAV * dt, 1100);
    const wasG = this.onGround, fallV = this.vy;
    this.moveAndCollide(dt);
    if (this.onGround && !wasG && fallV > 450) { dust(this.cx, this.y + this.h, 4); Sfx.land(); }
    if (this.onGround && this.standSolid && G.isSafe(this)) { this.safeX = this.x; this.safeY = this.y; }
    this.anim += dt * (this.onGround ? Math.abs(this.vx) / 30 : 0);
  }

  moveAndCollide(dt) {
    const solids = G.solids();
    this.x += this.vx * dt;
    for (const s of solids) {
      if (overlap(this, s)) {
        if (this.vx > 0) this.x = s.x - this.w;
        else if (this.vx < 0) this.x = s.x + s.w;
        else if (this.x + this.w / 2 < s.x + s.w / 2) this.x = s.x - this.w;
        else this.x = s.x + s.w;
        this.vx = 0;
      }
    }
    const prevBottom = this.y + this.h;
    this.y += this.vy * dt;
    this.onGround = false; this.standSolid = false;
    for (const s of solids) {
      if (overlap(this, s)) {
        if (this.vy > 0) { this.y = s.y - this.h; this.onGround = true; this.standSolid = true; }
        else if (this.vy < 0) this.y = s.y + s.h;
        this.vy = 0;
      }
    }
    if (this.vy >= 0) {
      for (const p of G.level.oneways) {
        if (this.x + this.w > p.x + 2 && this.x < p.x + p.w - 2 && prevBottom <= p.y + 0.5 && this.y + this.h >= p.y) {
          this.y = p.y - this.h; this.vy = 0; this.onGround = true;
        }
      }
    }
  }

  hurt(dmg, dir, kbx = 320, kby = 380) {
    if (this.inv > 0 || this.dead) return false;
    this.hp -= dmg; this.inv = 1.0;
    this.vx = dir * kbx; this.vy = -kby; this.jumping = false; this.onGround = false; this.lock = 0.25;
    Sfx.hurt(); G.shake(5 + dmg * 0.25);
    burst(this.cx, this.y + 20, 10, '#ffffff', 220, 0.4, 3);
    floatText(this.cx, this.y - 6, '-' + dmg, '#ff6a5a', 16);
    if (this.hp <= 0) { this.hp = 0; this.dead = true; this.deadT = 0; Sfx.die(); }
    return true;
  }

  draw(c) {
    if (this.inv > 0 && !this.dead && Math.floor(this.inv * 18) % 2 === 0) return;
    const fx = this.cx, fy = this.y + this.h;
    if (this.onGround) ellipse(c, fx, fy + 1, 13, 3, 0, 'rgba(0,0,0,0.25)');
    c.save(); c.translate(fx, fy);
    if (this.dead) { const k = Math.min(1, this.deadT / 0.45); c.translate(0, -4 * k); c.rotate(-this.face * k * Math.PI / 2); }
    c.scale(this.face, 1);
    const skin = '#e2b48c', shirt = '#2f6fa8', shirtD = '#24557f', vest = '#c4a061', pants = '#4b4336', boot = '#2b211a', hat = '#8b6a3c';
    const run = this.onGround && Math.abs(this.vx) > 30;
    const ph = this.anim, sw = run ? Math.sin(ph) : 0;
    const air = !this.onGround && !this.dead;
    let f1x, f1y, f2x, f2y;
    if (air) { f1x = 7; f1y = -9; f2x = -7; f2y = -3; }
    else if (run) {
      f1x = Math.sin(ph) * 12; f1y = -Math.max(0, -Math.cos(ph)) * 8;
      f2x = -Math.sin(ph) * 12; f2y = -Math.max(0, Math.cos(ph)) * 8;
    } else { f1x = 4; f1y = 0; f2x = -4; f2y = 0; }
    const hipY = -21 + (run ? Math.abs(Math.cos(ph)) * -1.5 : 0);
    // Perna de trás
    leg(c, -1, hipY, f2x, f2y, 23, -1, 6, 5, '#3a3329');
    c.fillStyle = boot; c.fillRect(f2x - 3, f2y - 4, 9, 4);
    // Braço de trás
    const sh = [1, hipY - 16];
    const bA = Math.PI / 2 + 0.2 - sw * 0.6;
    c.strokeStyle = shirtD; c.lineWidth = 4.5; c.lineCap = 'round';
    c.beginPath(); c.moveTo(sh[0], sh[1]); c.lineTo(sh[0] + Math.cos(bA) * 15, sh[1] + Math.sin(bA) * 15); c.stroke();
    // Mochila e tronco
    c.fillStyle = '#6b5a3a'; roundRect(c, -13, hipY - 18, 7, 15, 2); c.fill();
    c.fillStyle = shirt; roundRect(c, -7, hipY - 19, 14, 21, 4); c.fill();
    c.fillStyle = vest; c.fillRect(-7, hipY - 17, 5, 17); c.fillRect(3, hipY - 17, 4, 17);
    c.fillStyle = '#3a2c1c'; c.fillRect(-7, hipY - 1, 14, 3);
    // Perna da frente
    leg(c, 1, hipY, f1x, f1y, 23, -1, 6, 5, pants);
    c.fillStyle = boot; c.fillRect(f1x - 3, f1y - 4, 9, 4);
    // Cabeça e chapéu
    const hy = hipY - 26;
    c.fillStyle = skin; c.beginPath(); c.arc(1, hy, 6.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#222'; c.fillRect(4, hy - 1, 2, 2);
    ellipse(c, 1, hy - 4, 11, 2.6, 0, hat);
    c.fillStyle = hat; roundRect(c, -5, hy - 12, 12, 8, 3); c.fill();
    c.fillStyle = '#4e3a1f'; c.fillRect(-5, hy - 6, 12, 2);
    // Braço da frente: faca, mira ou balanço
    c.lineWidth = 5; c.strokeStyle = shirt;
    if (this.knifeT > 0 && !this.dead) {
      const k = 1 - this.knifeT / 0.22;
      const th = lerp(-2.3, 0.7, easeOut(Math.min(1, k * 1.4)));
      const hx = sh[0] + Math.cos(th) * 15, hy2 = sh[1] + Math.sin(th) * 15;
      c.beginPath(); c.moveTo(sh[0], sh[1]); c.lineTo(hx, hy2); c.stroke();
      c.strokeStyle = '#dfe6ee'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(hx, hy2); c.lineTo(hx + Math.cos(th) * 13, hy2 + Math.sin(th) * 13); c.stroke();
      if (k > 0.15 && k < 0.8) {
        c.strokeStyle = 'rgba(255,255,255,' + (0.8 - k * 0.6) + ')'; c.lineWidth = 4;
        c.beginPath(); c.arc(sh[0], sh[1], 30, th - 1.6, th); c.stroke();
        c.strokeStyle = 'rgba(255,240,180,0.35)'; c.lineWidth = 10;
        c.beginPath(); c.arc(sh[0], sh[1], 24, th - 1.3, th); c.stroke();
      }
      c.fillStyle = skin; c.beginPath(); c.arc(hx, hy2, 2.8, 0, Math.PI * 2); c.fill();
    } else if (this.aimT > 0 && !this.dead) {
      const hx = sh[0] + 15, hy2 = sh[1];
      c.beginPath(); c.moveTo(sh[0], sh[1]); c.lineTo(hx, hy2); c.stroke();
      c.fillStyle = '#2a2a2e'; c.fillRect(hx - 1, hy2 - 3.5, 14, 5); c.fillRect(hx, hy2 - 1, 4, 7);
      c.fillStyle = skin; c.beginPath(); c.arc(hx, hy2, 2.8, 0, Math.PI * 2); c.fill();
      if (this.muzzle > 0) {
        c.fillStyle = '#fff6b0'; c.beginPath();
        for (let i = 0; i < 10; i++) { const r = i % 2 ? 4 : 11, a = i * Math.PI / 5; c.lineTo(hx + 18 + Math.cos(a) * r, hy2 - 1 + Math.sin(a) * r * 0.7); }
        c.closePath(); c.fill();
      }
    } else {
      const fA = Math.PI / 2 - 0.25 + sw * 0.6;
      const hx = sh[0] + Math.cos(fA) * 15, hy2 = sh[1] + Math.sin(fA) * 15;
      c.beginPath(); c.moveTo(sh[0], sh[1]); c.lineTo(hx, hy2); c.stroke();
      c.fillStyle = '#2a2a2e'; c.fillRect(hx - 2, hy2, 4, 8);
      c.fillStyle = skin; c.beginPath(); c.arc(hx, hy2, 2.8, 0, Math.PI * 2); c.fill();
    }
    c.restore();
    if (this.stun > 0 && !this.dead) drawStars(c, this.cx, this.y - 6, this.t, 14);
  }
}

// =========================================================
//  DINOSSAUROS - classe base
// =========================================================
class Dino {
  constructor(o) {
    Object.assign(this, {
      name: '', x: 0, y: GROUND_Y, w: 80, h: 60, vx: 0, vy: 0, kvx: 0, face: -1, hp: 100,
      flash: 0, state: 'idle', t: 0, anim: 0, walkPh: 0, stride: 20, dead: false, deathT: 0, keyDropped: false,
      active: false, warn: 0, kbScale: 1, contactDmg: 8, onGround: true, stun: 0, half: 0, collapse: false,
      hitWall: 0, tip: ''
    }, o);
    this.maxHp = this.hp;
    if (!this.half) this.half = this.w / 2;
  }
  body() { return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h }; }
  // Caixa à frente/atrás do corpo, considerando a direção para onde olha
  front(off, w, top, h) { return { x: this.face > 0 ? this.x + off : this.x - off - w, y: this.y - top, w, h }; }
  back(off, w, top, h) { return { x: this.face > 0 ? this.x - off - w : this.x + off, y: this.y - top, w, h }; }
  set(s) { this.state = s; this.t = 0; }
  col(cl) { return this.flash > 0 ? '#ffffff' : cl; }
  facePlayer(p) { this.face = p.cx < this.x ? -1 : 1; }
  headPos() { return [this.x + this.face * this.w * 0.4, this.y - this.h]; }
  hurtboxes() { return [Object.assign(this.body(), { mult: 1 })]; }
  attackBoxes() { return []; }
  contactBoxes() { return [this.body()]; }
  idle() { this.vx = 0; }
  onHurt() {}
  onLand(v) { if (v > 300) dust(this.x, GROUND_Y, 8); }

  update(dt) {
    this.anim += dt; this.t += dt;
    this.flash = Math.max(0, this.flash - dt); this.warn = Math.max(0, this.warn - dt);
    if (this.dead) {
      this.deathT += dt; this.x += this.kvx * dt; this.kvx *= Math.pow(0.05, dt);
      this.gravity(dt); this.clampArena();
      if (this.deathT > 1.3 && !this.keyDropped) {
        this.keyDropped = true; G.dropKey(this.x, this.y - Math.min(this.h, 120) * 0.6);
      }
      return;
    }
    if (this.active) this.think(dt, G.player); else this.idle(dt);
    this.x += (this.vx + this.kvx) * dt;
    this.kvx *= Math.pow(0.003, dt);
    this.walkPh += dt * Math.abs(this.vx) / this.stride;
    this.gravity(dt);
    this.clampArena();
  }
  gravity(dt) {
    if (this.y < GROUND_Y || this.vy < 0) {
      this.vy += GRAV * dt; this.y += this.vy * dt; this.onGround = false;
      if (this.y >= GROUND_Y) { const v = this.vy; this.y = GROUND_Y; this.vy = 0; this.onGround = true; this.onLand(v); }
    }
  }
  clampArena() {
    const a = G.arena; this.hitWall = 0;
    if (this.x - this.half < a.x0) { this.x = a.x0 + this.half; this.hitWall = -1; }
    else if (this.x + this.half > a.x1) { this.x = a.x1 - this.half; this.hitWall = 1; }
  }
  takeHit(dmg, dir, kb, kind) {
    if (this.dead || !this.active) return false;
    dmg = Math.max(1, Math.round(dmg));
    this.hp -= dmg; this.flash = 0.1; this.kvx += dir * kb * this.kbScale;
    floatText(this.x + rand(-24, 24), this.y - Math.min(this.h, 170) - 8, '-' + dmg,
      kind === 'knife' ? '#ffe066' : '#ffffff', kind === 'knife' ? 19 : 14);
    if (this.hp <= 0) { this.hp = 0; this.die(dir); } else this.onHurt(dmg, dir, kind);
    return true;
  }
  die(dir) {
    this.dead = true; this.deathT = 0; this.vx = 0; this.kvx = dir * 160 * this.kbScale; this.warn = 0; this.stun = 0;
    Sfx.dinoDie(); G.shake(12); G.hitStop = 0.18; dust(this.x, GROUND_Y, 24); G.onBossDefeated(this);
  }
  draw(c) {
    ellipse(c, this.x, GROUND_Y + 2, this.half * 0.95, 6, 0, 'rgba(0,0,0,0.25)');
    c.save(); c.translate(this.x, this.y);
    if (this.dead) this.deathPose(c, easeOut(Math.min(1, this.deathT / 0.8)));
    c.scale(this.face, 1);
    this.drawBody(c);
    c.restore();
    if (this.warn > 0 && !this.dead) this.drawWarn(c);
    if (this.stun > 0 && !this.dead) { const hp = this.headPos(); drawStars(c, hp[0], hp[1] - 22, this.anim, 20); }
  }
  // Morte padrão: vira de barriga para cima (estilo desenho animado)
  deathPose(c, k) {
    if (this.collapse) return;
    c.translate(0, -this.h * 0.5); c.scale(1, 1 - 2 * k); c.translate(0, this.h * 0.5);
  }
  drawWarn(c) {
    const [hx, hy] = this.headPos();
    const y = Math.max(74, hy - 36) + Math.sin(this.anim * 20) * 2;
    c.save(); c.globalAlpha = 0.65 + 0.35 * Math.sin(this.anim * 25);
    c.fillStyle = '#d62d20'; c.beginPath(); c.arc(hx, y, 12, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fff'; c.font = 'bold 18px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('!', hx, y + 1);
    c.restore();
  }
}

// =========================================================
//  FASE 1 - VELOCIRAPTOR: rápido, persegue, dá botes e garradas
// =========================================================
class Raptor extends Dino {
  constructor(x) {
    super({ name: 'Velociraptor', x, w: 70, h: 48, hp: 100, kbScale: 1, contactDmg: 6, face: -1, stride: 16,
      tip: 'Quando ele se agachar, prepare-se: o bote vem em seguida!' });
    this.pcd = 1.2; this.speed = 245;
  }
  headPos() { return [this.x + this.face * 36, this.y - 46]; }
  idle(dt) { this.vx = Math.sin(this.anim * 0.9) * 40; if (Math.abs(this.vx) > 5) this.face = sign(this.vx); }
  think(dt, p) {
    const dx = p.cx - this.x, dist = Math.abs(dx);
    const level = Math.abs((p.y + p.h) - this.y) < 70;
    switch (this.state) {
      case 'idle': this.set('chase'); break;
      case 'chase':
        this.facePlayer(p);
        this.vx = approach(this.vx, dist > 55 ? this.face * this.speed : 0, 1400 * dt);
        this.pcd -= dt;
        if (dist < 85 && level && this.t > 0.25) { this.set('slashW'); this.warn = 0.36; this.vx = 0; }
        else if (this.pcd <= 0 && ((dist > 140 && dist < 420) || (!level && dist < 160))) { this.set('crouch'); this.warn = 0.5; this.vx = 0; }
        break;
      case 'crouch':
        this.vx = 0; this.facePlayer(p);
        if (this.t > 0.5) {
          const dh = Math.max(0, this.y - (p.y + p.h));
          const vy0 = Math.max(620, Math.sqrt(2 * GRAV * (dh + 50)));
          const T = 2 * vy0 / GRAV;
          this.vy = -vy0; this.y -= 1; this.onGround = false;
          this.vx = clamp((p.cx + p.vx * 0.2 - this.x) / T, -600, 600);
          this.set('pounce'); Sfx.tone(520, 0.15, 'sawtooth', 0.1, 950);
        }
        break;
      case 'pounce':
        if (this.onGround && this.t > 0.08) { this.vx = 0; this.set('recover'); this.pcd = rand(1.3, 2.3); dust(this.x, GROUND_Y, 6); }
        break;
      case 'slashW': this.vx = 0; if (this.t > 0.36) { this.set('slash'); Sfx.slash(); } break;
      case 'slash': this.vx = this.face * 140; if (this.t > 0.16) this.set('recover'); break;
      case 'recover': this.vx = approach(this.vx, 0, 900 * dt); if (this.t > 0.55) this.set('chase'); break;
      case 'retreat': if (this.onGround && this.t > 0.1) { this.set('chase'); this.pcd = Math.min(this.pcd, 0.4); } break;
    }
  }
  onHurt(dmg, dir, kind) {
    if (kind === 'knife' && (this.state === 'chase' || this.state === 'recover') && Math.random() < 0.5) {
      this.set('retreat'); this.vy = -480; this.y -= 1; this.onGround = false; this.vx = dir * 300; this.face = -dir;
    }
  }
  attackBoxes() {
    if (this.state === 'pounce') return [Object.assign(this.front(-15, 60, 46, 44), { dmg: 14, kb: 360, kby: 380 })];
    if (this.state === 'slash') return [Object.assign(this.front(5, 52, 44, 40), { dmg: 12, kb: 300, kby: 300 })];
    return [];
  }
  contactBoxes() { return this.state === 'chase' || this.state === 'recover' ? [this.body()] : []; }
  rLeg(c, hx, hy, fx, fy, col) {
    const ax = fx - 4, ay = fy - 7;
    leg(c, hx, hy, ax, ay, 28, -1, 8, 4.5, col);
    c.strokeStyle = col; c.lineWidth = 3.5; c.beginPath(); c.moveTo(ax, ay); c.lineTo(fx + 7, fy); c.stroke();
    c.strokeStyle = this.col('#efe6cf'); c.lineWidth = 2;
    c.beginPath(); c.arc(fx + 1, fy - 4, 4, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
  }
  drawBody(c) {
    const s = this.state, a = this.anim;
    const crouch = s === 'crouch' ? Math.min(1, this.t / 0.25) : (s === 'slashW' ? 0.3 : 0);
    const air = !this.onGround && !this.dead;
    const moving = Math.abs(this.vx) > 20 && this.onGround;
    const ph = this.walkPh;
    const by = -30 + crouch * 10 + (moving ? -Math.abs(Math.sin(ph)) * 2 : Math.sin(a * 3) * 0.8);
    const body = this.col('#9a7b4f'), dark = this.col('#6b5333'), belly = this.col('#d8c38f');
    const sway = Math.sin(a * 4) * 5;
    taper(c, -14, by - 2, -40, by - 8 + sway * 0.4, -68, by - 6 + sway, 13, 2, body);
    let f1x, f1y, f2x, f2y;
    if (air) { f1x = 18; f1y = by + 22; f2x = -16; f2y = by + 22; }
    else if (moving) {
      f1x = Math.sin(ph) * 16; f1y = -Math.max(0, -Math.cos(ph)) * 9;
      f2x = -Math.sin(ph) * 16; f2y = -Math.max(0, Math.cos(ph)) * 9;
    } else { f1x = 6; f1y = 0; f2x = -6; f2y = 0; }
    const hipY = by + 4;
    this.rLeg(c, -3, hipY, f2x, f2y, dark);
    ellipse(c, 0, by, 25, 11, -0.12, body);
    ellipse(c, 4, by + 4, 16, 6, -0.12, belly);
    c.strokeStyle = this.col('#5a4429'); c.lineWidth = 2.5;
    for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-14 + i * 8, by - 9); c.lineTo(-11 + i * 8, by - 2); c.stroke(); }
    // Pescoço e cabeça
    const lunge = s === 'slash' ? 10 : 0;
    const hx = 30 + lunge, hy = by - 14 + crouch * 6;
    taper(c, 14, by - 3, 22, by - 12, hx - 4, hy + 1, 12, 8, body);
    c.fillStyle = body; c.beginPath(); c.moveTo(hx - 8, hy - 5); c.quadraticCurveTo(hx + 6, hy - 9, hx + 21, hy - 1);
    c.lineTo(hx + 20, hy + 2); c.lineTo(hx - 6, hy + 5); c.closePath(); c.fill();
    const jaw = (s === 'slashW' || s === 'pounce' || s === 'crouch') ? 0.4 : 0.06;
    c.save(); c.translate(hx - 4, hy + 3); c.rotate(jaw);
    c.fillStyle = dark; c.beginPath(); c.moveTo(0, -1); c.lineTo(22, 0); c.lineTo(20, 3); c.lineTo(0, 4); c.closePath(); c.fill();
    if (jaw > 0.2) { c.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(5 + i * 4, -1); c.lineTo(7 + i * 4, -4); c.lineTo(9 + i * 4, -1); c.fill(); } }
    c.restore();
    ellipse(c, hx + 5, hy - 3, 2.4, 2.1, 0, this.col('#ffd84a'));
    c.fillStyle = '#111'; c.fillRect(hx + 5, hy - 4, 1.5, 2.5);
    // Penas no dorso
    c.strokeStyle = this.col('#7a3d2a'); c.lineWidth = 2;
    for (let i = 0; i < 6; i++) { const px = -18 + i * 7; c.beginPath(); c.moveTo(px, by - 9 + i * -0.6); c.lineTo(px - 5, by - 15 - Math.sin(a * 6 + i) * 1.5); c.stroke(); }
    // Braço com garras
    const armA = s === 'slashW' ? -1.7 : s === 'slash' ? 0.7 : 0.7 + Math.sin(a * 3) * 0.1;
    const ax = 15 + Math.cos(armA) * 12, ay = by + 2 + Math.sin(armA) * 12;
    c.strokeStyle = dark; c.lineWidth = 3.2; c.beginPath(); c.moveTo(15, by + 2); c.lineTo(ax, ay); c.stroke();
    c.strokeStyle = this.col('#efe6cf'); c.lineWidth = 1.5;
    for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + Math.cos(armA + i * 0.4) * 6, ay + Math.sin(armA + i * 0.4) * 6); c.stroke(); }
    this.rLeg(c, -1, hipY, f1x, f1y, body);
  }
}

// =========================================================
//  FASE 2 - ANQUILOSSAURO: casco blindado, cauda-clava; cabeça é o ponto fraco
// =========================================================
class Anky extends Dino {
  constructor(x) {
    super({ name: 'Anquilossauro', x, w: 150, h: 62, hp: 140, kbScale: 0.25, contactDmg: 0, face: -1, half: 80, stride: 12,
      tip: 'Casco blindado! Acerte a cabeça (brilho amarelo) pela frente.' });
    this.speed = 58; this.turnT = 0;
  }
  headPos() { return [this.x + this.face * 86, this.y - 40]; }
  headBox() { return this.front(this.w / 2 - 14, 46, 44, 38); }
  idle() { this.vx = 0; }
  hurtboxes() {
    const body = Object.assign(this.body(), { armor: true });
    const tail = Object.assign(this.back(this.w / 2 - 10, 80, 40, 30), { armor: true });
    if (this.state === 'spin' || this.state === 'turn') return [body, tail];
    return [Object.assign(this.headBox(), { mult: 1.3 }), body, tail];
  }
  think(dt, p) {
    const dx = p.cx - this.x, dist = Math.abs(dx), behind = sign(dx) !== this.face;
    switch (this.state) {
      case 'idle': this.set('walk'); break;
      case 'walk':
        this.vx = (!behind && dist > 150) ? this.face * this.speed : approach(this.vx, 0, 200 * dt);
        this.turnT = behind ? this.turnT + dt : 0;
        if (behind && dist < 230 && this.t > 0.4) { this.set('tailW'); this.warn = 0.7; this.vx = 0; }
        else if (!behind && dist < 150 && this.t > 0.6) { this.set('spinW'); this.warn = 0.9; this.vx = 0; }
        else if (behind && this.turnT > 0.9) { this.set('turn'); this.vx = 0; }
        break;
      case 'turn': this.vx = 0; if (this.t > 0.5) { this.face = -this.face; this.set('walk'); } break;
      case 'tailW': this.vx = 0; if (this.t > 0.7) { this.set('tail'); Sfx.slash(); } break;
      case 'tail': if (this.t > 0.32) this.set('rest'); break;
      case 'spinW': this.vx = 0; if (this.t > 0.9) { this.set('spin'); Sfx.slash(); } break;
      case 'spin':
        if (this.t > 0.5) { this.face = -this.face; this.set('rest'); G.shake(4); dust(this.x, GROUND_Y, 10); }
        break;
      case 'rest': this.vx = 0; if (this.t > 0.9) this.set('walk'); break;
    }
  }
  attackBoxes() {
    if (this.state === 'tail' && this.t < 0.25) return [Object.assign(this.back(this.w / 2 - 20, 120, 70, 70), { dmg: 14, kb: 480, kby: 420 })];
    if (this.state === 'spin' && this.t > 0.1 && this.t < 0.45) return [{ x: this.x - this.w / 2 - 110, y: this.y - 60, w: this.w + 220, h: 60, dmg: 14, kb: 460, kby: 400 }];
    return [];
  }
  drawBody(c) {
    const a = this.anim, s = this.state;
    let sx = 1;
    if (s === 'spin') sx = Math.cos(Math.min(1, this.t / 0.5) * Math.PI);
    if (s === 'turn') sx = Math.cos(Math.min(1, this.t / 0.5) * Math.PI);
    c.scale(Math.abs(sx) < 0.02 ? 0.02 : sx, 1);
    const sh = this.col('#6d6a55'), shD = this.col('#4b4838'), stud = this.col('#9a9576'), spike = this.col('#e1d8b8');
    const skin = this.col('#857a5c'), skinD = this.col('#615840'), headC = this.col('#e9c79c');
    const ph = this.walkPh, moving = Math.abs(this.vx) > 5;
    // Cauda com clava
    let up = 0, back = 0;
    if (s === 'tailW') up = Math.min(1, this.t / 0.4) * 30 + Math.sin(a * 40) * 2;
    if (s === 'tail') { up = 30 - Math.min(1, this.t / 0.1) * 45; back = Math.sin(Math.min(1, this.t / 0.25) * Math.PI) * 28; }
    const tx = -150 - back, ty = -24 - up + Math.sin(a * 2) * 4;
    taper(c, -58, -26, -108, -30 - up * 0.4, tx + 12, ty, 22, 9, skin);
    ellipse(c, tx, ty, 18, 12, 0, shD);
    ellipse(c, tx - 7, ty - 3, 7, 5, 0, stud); ellipse(c, tx + 6, ty + 3, 7, 5, 0, stud);
    if (s === 'tailW' && !this.dead) {
      c.strokeStyle = 'rgba(255,80,50,' + (0.5 + 0.5 * Math.sin(a * 30)) + ')'; c.lineWidth = 3;
      c.beginPath(); c.arc(tx, ty, 23, 0, Math.PI * 2); c.stroke();
    }
    // Pernas (par de trás mais escuro)
    const legAt = (lx, off, col) => {
      const lift = moving ? Math.max(0, Math.sin(ph + off)) * 6 : 0;
      c.fillStyle = col; roundRect(c, lx - 8, -30, 16, 30 - lift, 5); c.fill();
    };
    legAt(-42, 0, skinD); legAt(38, Math.PI, skinD);

class Brachio extends Dino {
  constructor(x) {
    super({ name: 'Braquiossauro', x, w: 260, h: 220, hp: 300, kbScale: 0, contactDmg: 10, face: -1, half: 135, stride: 26,
      collapse: true, tip: 'Pule as ondas de choque, saia das sombras e cuidado com o golpe de pescoço. Ataque a cabeça!' });
    this.speed = 38; this.rear = 0; this.drop = 0; this.atkCd = 2.5; this.turnT = 0; this.count = 0; this.swT = 0.8; this.dazeT = 1.5;

  geo() {

    const piv = [-80, -170], rot = -0.2 * r;

  headPos() { const g = this.geo(); return [this.x + this.face * g.head[0], this.y + g.head[1]]; }

      this.lbox(lerp(sh[0], hd[0], 0.65), lerp(sh[1], hd[1], 0.65), 42, 42, { mult: 1 }),
      this.lbox(lerp(sh[0], hd[0], 0.35), lerp(sh[1], hd[1], 0.35), 46, 46, { mult: 1 }),

    if (this.state === 'sweep' && this.t > 0.08) { const hd = this.geo().head; return [Object.assign(this.lbox(hd[0], hd[1] - 10, 100, 120), { dmg: 16, kb: 460, kby: 380 })]; }
